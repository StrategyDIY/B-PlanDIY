<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#EAF0F9;color:#29384A;min-height:100vh;display:flex;flex-direction:column;}
nav{background:var(--white,#FCFCFA);border-bottom:1px solid #E3E8F0;padding:0 24px;height:72px;display:flex;align-items:center;gap:12px;}
nav img{width:52px;height:52px;object-fit:contain;}
nav span{font-size:18px;font-weight:700;color:#01236D;}
.hero{background:#EAF0F9;color:#01236D;text-align:center;padding:0 24px;height:320px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid #E3E8F0;}
.hero h1{font-size:clamp(22px,3vw,32px);font-weight:800;margin-bottom:8px;}
.hero p{font-size:15px;color:#5A6C7E;max-width:440px;margin:0 auto;line-height:1.6;}
.card{max-width:460px;margin:40px auto;background:white;border-radius:16px;box-shadow:0 4px 24px rgba(1,35,109,0.1);overflow:hidden;}
.card-header{background:var(--white,#FCFCFA);border-bottom:1px solid #E3E8F0;padding:20px 28px;}
.card-header h2{font-size:17px;font-weight:700;color:#01236D;}
.card-body{padding:32px;}
.field{margin-bottom:20px;}
.field label{display:block;font-size:13px;font-weight:600;color:#01236d;margin-bottom:6px;}
.field input{width:100%;border:1px solid #E3E8F0;border-radius:7px;padding:12px;font-size:15px;font-family:inherit;color:#29384A;transition:border-color 0.15s;}
.field input:focus{outline:none;border-color:#1B4FA8;box-shadow:0 0 0 3px rgba(27,79,168,0.18);}
.btn{width:100%;background:#01236d;color:white;border:none;border-radius:8px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity 0.15s;margin-top:4px;}
.btn:hover{opacity:0.88;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.msg{margin-top:16px;padding:14px;border-radius:8px;font-size:14px;text-align:center;display:none;}
.msg.success{background:#EAF0F9;color:#1F7A7C;border:1px solid #E3E8F0;}
.msg.error{background:#FDEEEB;color:#B14A38;border:1px solid #F2CFC7;}
.buy-link{text-align:center;margin-top:20px;font-size:14px;color:#5A6C7E;}
.buy-link a{color:#01236d;font-weight:600;text-decoration:underline;}
footer{text-align:center;padding:24px;font-size:13px;color:#5A6C7E;margin-top:auto;}
@media(max-width:640px){
  .hero,.sample-intro{height:auto;min-height:220px;padding:36px 20px;}
}
</style>

<script>
document.getElementById('emailInput').addEventListener('keydown', function(e){
  if(e.key==='Enter') verifyAccess();
});

async function verifyAccess(){
  var email = document.getElementById('emailInput').value.trim();
  var btn = document.getElementById('verifyBtn');
  var msg = document.getElementById('msg');

  if(!email){ showMsg('Please enter your email address.','error'); return; }
  if(!email.includes('@')){ showMsg('Please enter a valid email address.','error'); return; }

  btn.disabled=true;
  btn.textContent='Checking...';
  msg.style.display='none';

  try{
    var res = await fetch('/api/verify-user', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email: email})
    });
    var data = await res.json();

    if(data.success){
      localStorage.setItem('bpd_access_expiry', String(data.expiry));
      if(data.token)localStorage.setItem('bpd_access_token', data.token);
      showMsg('Access verified! Redirecting to the app...','success');
      setTimeout(function(){ window.location.href='/app.html'; }, 1500);
    } else {
      showMsg(data.message||'No active subscription found for this email. Please check your email or purchase access.','error');
      btn.disabled=false;
      btn.textContent='Verify and go to the app →';
    }
  } catch(e) {
    showMsg('Something went wrong. Please try again.','error');
    btn.disabled=false;
    btn.textContent='Verify and go to the app →';
  }
}

function showMsg(text, type){
  var msg=document.getElementById('msg');
  msg.textContent=text;
  msg.className='msg '+type;
  msg.style.display='block';
}
</script>
