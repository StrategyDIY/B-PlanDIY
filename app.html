<style>
#loading{display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#01236d;font-size:18px;flex-direction:column;gap:12px;}
.spinner{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #01236d;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
/* Pulsing dot shown inside a "Suggest with AI" button while it is working */
@keyframes bpdPulse{0%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}100%{opacity:1;transform:scale(1)}}
.bpd-pulse{animation:bpdPulse 1s ease-in-out infinite;}
/* ============================================================
   Interaction polish. Inline styles cannot express :hover or
   :focus, so these add responsiveness without fighting them.
   ============================================================ */

/* Fields react when you are typing in them */
input:not([type=checkbox]):not([type=radio]), select, textarea{
  transition:border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
}
input:not([type=checkbox]):not([type=radio]):hover, select:hover, textarea:hover{
  border-color:#8A98A6 !important;
}
input:not([type=checkbox]):not([type=radio]):focus, select:focus, textarea:focus{
  border-color:#2A9D9F !important;
  box-shadow:0 0 0 3px rgba(42,157,159,0.20) !important;
  outline:none !important;
}

/* Buttons lift slightly and deepen on hover */
button{transition:transform .12s ease, box-shadow .15s ease, filter .15s ease, background-color .15s ease;}
button:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.04);box-shadow:0 3px 10px rgba(1,35,109,0.13);}
button:not(:disabled):active{transform:translateY(0);box-shadow:0 1px 3px rgba(1,35,109,0.12);}
button:disabled{opacity:.55;cursor:not-allowed !important;}
button:focus-visible{outline:2px solid #2A9D9F;outline-offset:2px;}

/* Checkboxes get a pointer and a little feedback */
input[type=checkbox]{transition:transform .12s ease;}
input[type=checkbox]:hover{transform:scale(1.12);}

/* Money and figures line up in columns */
.bpd-num, td, th{font-variant-numeric:tabular-nums;}

/* Panels and dialogs arrive rather than snapping in */
@keyframes bpdFadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bpdFadeIn{from{opacity:0}to{opacity:1}}
.bpd-appear{animation:bpdFadeUp .22s ease both;}
.bpd-overlay{animation:bpdFadeIn .18s ease both;}

/* A figure that has just changed pulses once, so the eye catches it */
@keyframes bpdNumPop{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
.bpd-pop{animation:bpdNumPop .35s ease;display:inline-block;}

/* Softer, warmer page background so white cards read as raised */
body{background:#FCFCFA;}

/* Links */
a{transition:color .15s ease;}

/* Scrollbars, where the browser allows styling */
*::-webkit-scrollbar{height:12px;width:12px;}
*::-webkit-scrollbar-thumb{background:#01236D;border-radius:6px;border:3px solid transparent;background-clip:content-box;}
*::-webkit-scrollbar-thumb:hover{background:#02306F;background-clip:content-box;}
*::-webkit-scrollbar-track{background:transparent;}
/* Firefox uses its own properties */
html{scrollbar-color:#01236D transparent;scrollbar-width:thin;}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  button:not(:disabled):hover{transform:none;}
}
/* Consistent 26px rhythm between form rows */
.bpd-field{margin-bottom:26px;}
input:not([type=checkbox]):not([type=radio]):focus, select:focus, textarea:focus{
  border-color:#2A9D9F !important;
  box-shadow:0 0 0 3px rgba(42,157,159,0.18) !important;
}
select{border-radius:10px !important;padding:13px 12px !important;}

function shortMonth(m){
  if(!m)return"";
  if(/^Month /.test(m))return m.replace("Month ","M");
  return m.replace(/\s(\d{2})(\d{2})$/,function(_,a,b){return" "+b;});
}

const STORAGE_KEY="bpg_fd";

function fmtDate(v){if(!v)return"Not specified";var parts=v.split("-");var months=["January","February","March","April","May","June","July","August","September","October","November","December"];return parseInt(parts[2])+" "+months[parseInt(parts[1])-1]+" "+parts[0];}
function fmt(n){const v=Math.round(Number(n));return(v<0?"-$":"$")+Math.abs(v).toLocaleString();}
// Per-unit figures need the cents. fmt() rounds to whole dollars, so a $5.20
// coffee showed as $5 and a $1.30 cost as $1 - and anything already worked out
// to two places was being rounded away at the point of display.
function fmt2(n){
  const v=Number(n)||0;
  return (v<0?"-$":"$")+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
// Gross profit as a percentage of sales. Blank when there are no sales, since
// dividing by zero would otherwise show a meaningless or infinite figure.
function gpPct(gp,rev){
  if(!rev)return "";
  return (Math.round(gp/rev*1000)/10).toFixed(1)+"%";
}
// Chart axis labels. Scales to the data instead of always dividing by 1000,
// which made every tick read "$0k" for businesses turning over under $1k a
// month. Keeps the sign, which Math.abs() alone would discard.
function axisFmt(v){
  const a=Math.abs(Number(v)||0);
  const sign=v<0?"-$":"$";
  if(a>=1000000)return sign+(a/1000000).toFixed(1).replace(/\.0$/,"")+"m";
  if(a>=10000)return sign+Math.round(a/1000)+"k";
  if(a>=1000)return sign+(a/1000).toFixed(1).replace(/\.0$/,"")+"k";
  return sign+Math.round(a).toLocaleString();
}

function parseMonthly(str,def){
  if(def===undefined)def=0;
  if(!str||str.toLowerCase()==="no"||!str.trim())return Array(12).fill(def);
  const s=str.trim();
  if(s.includes("M")&&s.includes(":")){
    const arr=Array(12).fill(def);
    s.split(",").forEach(part=>{
      const m=part.trim().match(/M(\d+):([0-9.]+)/i);
      if(m){const idx=parseInt(m[1])-1;if(idx>=0&&idx<12)arr[idx]=parseFloat(m[2]);}
    });
    return arr;
  }
  const n=parseFloat(s.replace(/[^0-9.]/g,""));
  return Array(12).fill(isNaN(n)?def:n);
}

function parseGrowth(str){
  if(!str||str.toLowerCase()==="no"||!str.trim())return Array(12).fill(0);
  const s=str.trim();
  if(s.includes("M")&&s.includes(":")){
    const arr=Array(12).fill(0);
    s.split(",").forEach(part=>{
      const m=part.trim().match(/M(\d+):([0-9.]+)/i);
      if(m){const idx=parseInt(m[1])-1;if(idx>=0&&idx<12)arr[idx]=parseFloat(m[2]);}
    });
    return arr;
  }
  const n=parseFloat(s.replace(/[^0-9.]/g,""));
  return Array(12).fill(isNaN(n)?0:n);
}

// Repairs plans saved before the monthly grids seeded themselves. A category
// could be left with its grid ticked while the amount was still stored as a
// single flat number - so the twelve boxes rendered blank while the forecast
// carried on using the flat figure, showing a 12-month total with nothing
// visibly entered. Runs on load and on import, and is a no-op once fixed.
function repairMonthGrids(d){
  if(!d||typeof d!=="object")return d;
  var PREFIX={monthlyUnits:"monthlyUnitsM",avgPrice:"avgPriceM",avgCost:"avgCostM",otherRevenue:"otherRevM"};
  var FLAT={monthlyUnits:"month1Units"};
  Object.keys(d).forEach(function(k){
    if(k.length<=8||k.slice(-8)!=="_monthly"||d[k]!=="1")return;
    var key=k.slice(0,-8);
    var pre=PREFIX[key]||(key+"M");
    var flatK=FLAT[key]||key;
    var stored=String(d[key]||"");
    if(stored.indexOf("M")>=0)return;            // already per-month
    var v=parseFloat(String(d[flatK]||"").replace(/[^0-9.-]/g,""));
    if(isNaN(v))return;
    for(var m=1;m<=12;m++)if(!d[pre+m])d[pre+m]=String(v);
    d[key]=Array.from({length:12},function(_,i){return "M"+(i+1)+":"+(d[pre+(i+1)]||v);}).join(",");
  });
  return d;
}

function calcCashflow(f){
  const open=parseFloat(f.openingBalance)||0;
  const unitGrowth=parseGrowth(f.unitGrowth);
  const priceInc=parseGrowth(f.priceInc);
  const costInc=parseGrowth(f.costInc);
  const avgSales=parseMonthly(f.avgSales,0);
  const avgPrice=parseMonthly(f.avgPrice,0);
  const avgCost=parseMonthly(f.avgCost,0);
  const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var startYear=0,startMonth=0;
  if(f.cfStartDate){var parts=f.cfStartDate.split("-");startYear=parseInt(parts[0])||0;startMonth=parseInt(parts[1])||0;}
  function getMonthLabel(i){
    if(!startYear||!startMonth)return"Month "+(i+1);
    var m=(startMonth-1+i)%12;
    var y=startYear+Math.floor((startMonth-1+i)/12);
    return monthNames[m]+" "+y;
  }

  const expArr={};
  expCats.forEach(c=>{expArr[c.id]=parseMonthly(f[c.id],0);});
  const txArr={};
  txCats.forEach(c=>{txArr[c.id]=parseMonthly(f[c.id],0);});
  // A business that is not registered charges no products/services tax, so the
  // rate is ignored rather than applied. The rate itself is left untouched in
  // storage, so ticking the box again restores it.
  //
  // Plans created before this checkbox existed have no taxRegistered value at
  // all. Treating those as "not registered" would silently strip the tax line
  // out of a forecast someone had already built, so an absent flag falls back
  // to the rate: if they entered one, they were registered.
  const taxRegistered = (f.taxRegistered===undefined||f.taxRegistered===null)
    ? (parseFloat(f.taxRate)||0)>0
    : f.taxRegistered==="1";
  const taxRate=taxRegistered?(parseFloat(f.taxRate)||0):0;
  let accTax=0;

  // Extra sales and costs implied by the Step 4 goals. Opt-in, because a user
  // may already have built the growth into the figures they typed. Spread evenly
  // across the 12 months unless they have entered monthly amounts instead.
  const goalUnitsTotal=parseFloat(f.goalSalesTotal)||0;
  const goalUnitsOn=f.goalSalesApply==="1";
  // The monthly grid is used only when its checkbox is ticked. Testing for the
  // presence of the data alone meant that unticking hid the grid but the twelve
  // amounts carried on being applied, while the panel above said "spread
  // evenly" - the explanation on screen and the arithmetic disagreed. The
  // amounts are kept in storage either way, so re-ticking restores them.
  const goalUnitsGridOn=f.goalSalesMonthly_monthly==="1";
  const goalUnitsArr=(goalUnitsGridOn&&f.goalSalesMonthly&&String(f.goalSalesMonthly).indexOf("M")>=0)?parseMonthly(f.goalSalesMonthly,0):null;
  function goalUnitsFor(i){
    if(!goalUnitsOn)return 0;
    return goalUnitsArr?(goalUnitsArr[i]||0):goalUnitsTotal/12;
  }
  // Goal-driven costs are captured per expense category in Step 4, stored as
  // "xMkt:3000|xTeam:8000", and added to that category spread evenly over the
  // year. Landing them in the real categories keeps the cashflow readable.
  const goalExpOn=f.goalExpApply==="1";
  // Per category, the amount charged in each of the 12 months. Keeping this by
  // month rather than as an annual total means a salary starting partway
  // through the year lands only in the months it is actually paid.
  const goalExpMonthly={};
  if(goalExpOn&&f.goalExpLines){
    String(f.goalExpLines).split("|").forEach(function(p){
      var bits=p.split(":");
      var id,amt,start;
      if(bits.length>=3){ id=(bits[1]||"").trim(); amt=parseFloat(bits[2]); start=parseInt(bits[3]); }
      else { id=(bits[0]||"").trim(); amt=parseFloat(bits[1]); start=NaN; }   // older two-part rows
      if(!id||isNaN(amt))return;
      if(isNaN(start)||start<1||start>12)start=1;
      if(!goalExpMonthly[id])goalExpMonthly[id]=Array(12).fill(0);
      for(var m=start;m<=12;m++)goalExpMonthly[id][m-1]+=amt/12;
    });
  }
  function goalExpFor(catId,i){
    var arr0=goalExpMonthly[catId];
    if(!arr0)return 0;
    // Monthly override, used only while its checkbox is ticked - see the note
    // on goalUnitsArr above. Unticking reverts to the even spread without
    // discarding what was typed.
    var gridOn=f["goalExpM_"+catId+"_monthly"]==="1";
    var ov=f["goalExpM_"+catId];
    if(gridOn&&ov&&String(ov).indexOf("M")>=0){
      var arr=parseMonthly(ov,0);
      return arr[i]||0;
    }
    return arr0[i]||0;
  }

  let bal=open;
  const rows=[];

  for(let i=0;i<12;i++){
    // Revenue
    const monthlyUnits=parseMonthly(f.monthlyUnits,0);
    const hasMonthlyUnits=f.monthlyUnits&&f.monthlyUnits.includes("M");
    let units=hasMonthlyUnits?monthlyUnits[i]:parseFloat(f["month1Units"]||0);
    if(!hasMonthlyUnits&&i>0){
      for(let j=0;j<i;j++) units=units*(1+(unitGrowth[j]||0)/100);
    }
    units=units+goalUnitsFor(i);
    let price=avgPrice[i]||parseFloat(f.avgPrice)||0;
    if(priceInc[i]) price=price*(1+priceInc[i]/100);
    const revProducts=Math.round(units*price);
    const revOther=Math.round(parseMonthly(f.otherRevenue,0)[i]);
    const revenue=revProducts+revOther;

    // COGS
    let cost=avgCost[i]||parseFloat(f.avgCost)||0;
    if(costInc[i]) cost=cost*(1+costInc[i]/100);
    const cogs=Math.round(units*cost);

    const grossProfit=revenue-cogs;

    // Expenses
    const expDetail={};
    let totalExpenses=0;
    expCats.forEach(c=>{
      const v=Math.round(expArr[c.id][i]+goalExpFor(c.id,i));
      expDetail[c.id]=v;
      totalExpenses+=v;
    });

    const netProfit=grossProfit-totalExpenses;

    // Tax = (Net Profit + Team & contractors expense) * taxRate
    const teamExp=(expDetail["xTeam"]||0)+(expDetail["xCon"]||0);
    const taxableBase=netProfit+teamExp;
    const monthTax=Math.round(taxableBase*taxRate/100);
    const isTaxPayMonth=!!f["taxPayM"+(i+1)]||!Array.from({length:12},function(_,n){return f["taxPayM"+(n+1)];}).some(Boolean);
    const calcTax=isTaxPayMonth?accTax:0;
    if(isTaxPayMonth)accTax=0;
    accTax+=monthTax;

    // Other transactions
    const txDetail={};
    let otherTx=0;
    txCats.forEach(c=>{
      let v;
      if(c.id==="txTax"){
        // Always auto-calculated from the Tax rate - not user editable.
        // Convention: money in is positive, money out is negative.
        // Tax paid is an outflow, so the calculated figure is negated.
        v=-calcTax;
      } else {
        v=Math.round(txArr[c.id][i]);
      }
      txDetail[c.id]=v;
      otherTx+=v;
    });

    const netCashflow=netProfit+otherTx;
    const openBal=bal;
    bal=bal+netCashflow;

    rows.push({
      month:getMonthLabel(i),
      units:Math.round(units),
      avgPrice:Math.round(price*100)/100,
      avgCost:Math.round(cost*100)/100,
      revenue,revProducts,revOther,
      cogs,grossProfit,
      expDetail,totalExpenses,
      netProfit,
      txDetail,otherTx,
      netCashflow,
      openingBalance:openBal,
      closingBalance:bal
    });
  }
  return rows;
}

function WhatIf({liveRows,wiRev,wiExp,wiCos,setWiRev,setWiExp,setWiCos,onBreakeven,bkLoading,bkText,onClearBreakeven,suggestBtn,suggestBtnBusy,busyLabel,enteredPrice,enteredCost}){
  if(!liveRows||!liveRows.length)return null;
  var wiUnitsState=useState(0);var wiUnits=wiUnitsState[0];var setWiUnits=wiUnitsState[1];
  var wiPriceState=useState(0);var wiPrice=wiPriceState[0];var setWiPrice=wiPriceState[1];
  var wiCostState=useState(0);var wiCostU=wiCostState[0];var setWiCostU=wiCostState[1];
  var wiTeamState=useState(0);var wiTeam=wiTeamState[0];var setWiTeam=wiTeamState[1];
  var wiHiresState=useState([]);var wiHires=wiHiresState[0];var setWiHires=wiHiresState[1];
  var wiTotalExpState=useState(0);var wiTotalExp=wiTotalExpState[0];var setWiTotalExp=wiTotalExpState[1];

  // Units Sold stays a percentage - a percentage change in volume is the natural
  // way to think about it. Everything else is a dollar amount, so the slider
  // says exactly what it does: price and cost per unit, expenses per month.
  // Month labels taken from the forecast itself, so they match the cashflow
  // start date exactly as they do elsewhere in the app.
  function wiMonthLabel(m){
    var r=liveRows[m-1];
    return r&&r.month?shortMonth(r.month):("month "+m);
  }

  // Cost of any "what if I hired" people, month by month. Start months mean the
  // cost is not flat, so this is an array rather than a single figure.
  var wiHireMonthly=Array.from({length:12},function(_,i){
    return wiHires.reduce(function(s,h){
      var n=parseFloat(h.amt);
      if(isNaN(n))return s;
      var st=parseInt(h.start);
      if(isNaN(st)||st<1||st>12)st=1;
      return s+((i+1)>=st?n/12:0);
    },0);
  });
  var wiHireTotal=wiHireMonthly.reduce(function(s,v){return s+v;},0);

  const adj=liveRows.map(function(r,ri){
    var units=Math.round((r.units||0)*(1+wiUnits/100));
    var price=(r.units>0?(r.revProducts/r.units):0)+wiPrice;
    var cost=(r.units>0?(r.cogs/r.units):0)+wiCostU;
    if(price<0)price=0;
    if(cost<0)cost=0;
    var rev=Math.round(units*price)+(r.revOther||0);
    var cogs=Math.round(units*cost);
    var gp=rev-cogs;
    var exp=Math.round(r.totalExpenses+wiTeam+wiTotalExp+(wiHireMonthly[ri]||0));
    if(exp<0)exp=0;
    var np=gp-exp;
    return Object.assign({},r,{revenue:rev,cogs:cogs,grossProfit:gp,totalExpenses:exp,netProfit:np});
  });
  // The real forecast is bal = bal + netProfit + otherTx. Leaving otherTx out
  // meant the adjusted closing balance never matched the baseline, even with
  // every slider at zero - loans, asset purchases, tax and drawings were lost.
  var cb=liveRows[0].openingBalance||0;
  adj.forEach(function(r){cb+=r.netProfit+(r.otherTx||0);r.closingBalance=cb;});

  const sl={WebkitAppearance:"none",appearance:"none",width:"100%",height:4,borderRadius:2,background:"#E7EAED",outline:"none",cursor:"pointer",accentColor:GREEN};

  // Price and cost come straight from Average sale price and Average cost per
  // unit on the Details tab, so the slider baseline matches what was entered.
  // Falls back to deriving them from the forecast if those fields are blank.
  var totUnits=liveRows.reduce(function(s,r){return s+(r.units||0);},0);
  var totRevProducts=liveRows.reduce(function(s,r){return s+(r.revProducts||0);},0);
  var totCogs=liveRows.reduce(function(s,r){return s+(r.cogs||0);},0);
  var baseValues={
    units:totUnits/12,
    price:enteredPrice||(totUnits>0?totRevProducts/totUnits:0),
    cost:enteredCost||(totUnits>0?totCogs/totUnits:0),
    team:liveRows.reduce(function(s,r){return s+(r.expDetail&&r.expDetail.xTeam||0);},0)/12,
    totalExp:liveRows.reduce(function(s,r){return s+r.totalExpenses;},0)/12,
  };

  // Dollar sliders span plus or minus the baseline, so the range always suits
  // the size of the business. A sensible fallback applies when a baseline is 0.
  function dollarRange(base){
    var r=Math.abs(Math.round(base));
    if(r<10)r=base>0?10:100;
    var step=Math.max(1,Math.round(r/50));
    return {max:r,step:step};
  }
  var rPrice=dollarRange(baseValues.price);
  var rCost=dollarRange(baseValues.cost);
  var rTeam=dollarRange(baseValues.team);
  var rTotal=dollarRange(baseValues.totalExp);

  var sliders=[
    {label:"Units Sold",sub:"% change in volume",val:wiUnits,set:setWiUnits,posColor:GREEN_DARK,negColor:RED,base:baseValues.units,isUnits:true,min:-50,max:50,step:1},
    {label:"Average Price",sub:"$ per unit",val:wiPrice,set:setWiPrice,posColor:GREEN_DARK,negColor:RED,base:baseValues.price,isDollar:true,min:-rPrice.max,max:rPrice.max,step:rPrice.step},
    {label:"Average Cost",sub:"$ per unit",val:wiCostU,set:setWiCostU,posColor:RED,negColor:GREEN_DARK,base:baseValues.cost,isDollar:true,min:-rCost.max,max:rCost.max,step:rCost.step},
    {label:"Total Expenses",sub:"$ per month",val:wiTotalExp,set:setWiTotalExp,posColor:RED,negColor:GREEN_DARK,base:baseValues.totalExp,isDollar:true,min:-rTotal.max,max:rTotal.max,step:rTotal.step},
  ];

  return (
    <div style={{marginTop:24}}>
      <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:12,marginBottom:16}}>
        <span style={{fontSize:13,fontWeight:600,color:"#5F7183",textTransform:"uppercase",letterSpacing:"0.05em"}}>What If Scenarios</span>
        {(wiUnits||wiPrice||wiCostU||wiTeam||wiTotalExp||wiHires.length)?(
          <button style={{fontFamily:"inherit",fontSize:13,fontWeight:600,color:"#01236D",background:"none",border:"1px solid #D0B16F",borderRadius:6,padding:"5px 12px",cursor:"pointer",flexShrink:0}}
            onClick={function(){setWiUnits(0);setWiPrice(0);setWiCostU(0);setWiTeam(0);setWiTotalExp(0);setWiHires([]);}}>Reset to baseline</button>
        ):null}
      </div>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",position:"sticky",top:0,zIndex:5,background:"#fff",paddingBottom:12,marginBottom:20}}>
        {[{label:"Total Net Profit",base:liveRows.reduce(function(s,r){return s+r.netProfit;},0),adj:adj.reduce(function(s,r){return s+r.netProfit;},0)},
          {label:"Closing Bank Balance",base:liveRows[liveRows.length-1].closingBalance,adj:adj[adj.length-1].closingBalance}
        ].map(function(item,idx){
          var diff=item.adj-item.base;

function MonthGrid({keyPrefix,keyPostfix,storeKey,fdRef,onUpdate,GREEN,inp,btnSm,startMonth}){

    if(!rows.length){setBkLoading(false);return;}
    var sum=function(pick){return rows.reduce(function(s,r){return s+(pick(r)||0);},0);};
    var rev=sum(function(r){return r.revenue;});
    var cogs=sum(function(r){return r.cogs;});
    var exp=sum(function(r){return r.totalExpenses;});
    var np=sum(function(r){return r.netProfit;});
    var units=sum(function(r){return r.units;});
    var price=units?(sum(function(r){return r.revProducts;})/units):0;
    var unitCost=units?(cogs/units):0;
    var closing=rows[rows.length-1].closingBalance||0;
    var low=rows[0],lowV=rows[0].closingBalance||0;
    rows.forEach(function(r){if((r.closingBalance||0)<lowV){lowV=r.closingBalance||0;low=r;}});
    // Biggest expense lines, so suggestions target real costs
    var byCat={};
    rows.forEach(function(r){
      if(!r.expDetail)return;
      Object.keys(r.expDetail).forEach(function(k){byCat[k]=(byCat[k]||0)+(r.expDetail[k]||0);});
    });
    var top=Object.keys(byCat).filter(function(k){return byCat[k]>0;})
      .sort(function(a,b){return byCat[b]-byCat[a];}).slice(0,5)
      .map(function(k){
        var m=expCats.filter(function(e){return e.id===k;})[0];
        return (m?m.l:k)+": $"+Math.round(byCat[k]).toLocaleString();
      }).join("; ")||"none entered";

    var contribution=price-unitCost;
    var prompt="This business has a 12-month forecast that "+(np>=0?"makes a profit":"does not break even")+". Explain in practical terms how it could reach breakeven or improve, using the figures below.\n\n"+
      "Business: "+(fdRef.current.bizName||"")+" in "+(fdRef.current.industry||"")+"\n"+
      "12-MONTH FORECAST\n"+
      "Revenue: $"+Math.round(rev).toLocaleString()+"\n"+
      "Cost of sales: $"+Math.round(cogs).toLocaleString()+"\n"+
      "Expenses: $"+Math.round(exp).toLocaleString()+"\n"+
      "Net profit: $"+Math.round(np).toLocaleString()+"\n"+
      "Units sold: "+Math.round(units).toLocaleString()+"\n"+
      "Average price per unit: $"+price.toFixed(2)+"\n"+
      "Average cost per unit: $"+unitCost.toFixed(2)+"\n"+
      "Contribution per unit: $"+contribution.toFixed(2)+"\n"+
      "Closing bank balance: $"+Math.round(closing).toLocaleString()+"\n"+
      "Lowest bank balance: $"+Math.round(lowV).toLocaleString()+" in "+(low.month||"")+"\n"+
      "Largest expense lines: "+top+"\n\n"+
      "Give 3 or 4 specific options, each on its own line starting with a dash. Every option must contain a real number worked out from the figures above - for example how many more units, what price rise, or which cost to cut and by how much.\n"+
      "Where the contribution per unit is zero or negative, say so plainly first, because no volume of sales will reach breakeven until that is fixed.\n"+
      "Be realistic for a small New Zealand business. No preamble, no closing summary, under 160 words.";
    try{
      var res=await fetch("https://b-plandiy.com/.netlify/functions/anthropic",{method:"POST",headers:aiHeaders(),body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:400,messages:[{role:"user",content:prompt}]})});

    }catch(e){ setBkText("Could not get suggestions just now. Please try again."); }
    setBkLoading(false);
  }

  // Downscaled in a canvas before it is stored, never at render time. Keeps the
  // data URI to roughly 40-60KB whatever was chosen.
  function handleLogoFile(file){
    setLogoErr("");
    if(!file)return;
    if(!/^image\//.test(file.type)){setLogoErr("That is not an image file. Please choose a PNG or JPG.");return;}
    if(file.size>8*1024*1024){setLogoErr("That image is very large. Please choose one under 8MB.");return;}
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var MAX=500;
          var w=img.width,h=img.height;
          if(w>MAX||h>MAX){ var k=Math.min(MAX/w,MAX/h); w=Math.round(w*k); h=Math.round(h*k); }
          var cv=document.createElement("canvas");
          cv.width=w;cv.height=h;
          var ctx=cv.getContext("2d");
          // White behind the image: a transparent PNG would otherwise come out
          // black once flattened into the Word document.
          ctx.fillStyle="#ffffff";ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          var out=cv.toDataURL("image/png");
          if(out.length>900000){ out=cv.toDataURL("image/jpeg",0.85); }
          fdRef.current.brandLogo=out;
          fdRef.current.brandLogoW=String(w);
          fdRef.current.brandLogoH=String(h);
          try{ saveToStorage(); }catch(e){}
          // saveToStorage swallows quota errors, so confirm it actually landed.
          var ok=false;
          try{ ok=(JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}").brandLogo||"")===out; }catch(e){}
          if(!ok){
            fdRef.current.brandLogo="";
            saveToStorage();
            setLogoErr("There was not enough room to save that logo. Try a smaller or simpler image.");
            return;
          }
          setBrandLogo(out);
        }catch(e){ setLogoErr("That image could not be read. Please try a different file."); }
      };
      img.onerror=function(){ setLogoErr("That image could not be read. Please try a different file."); };
      img.src=reader.result;
    };
    reader.onerror=function(){ setLogoErr("That file could not be read. Please try again."); };
    reader.readAsDataURL(file);
  }
  function clearLogo(){
    fdRef.current.brandLogo="";fdRef.current.brandLogoW="";fdRef.current.brandLogoH="";

  function downloadCashflowExcel(){
    var cfRows=liveRows;
    if(!cfRows||!cfRows.length){alert("No cashflow data to export.");return;}
    var bizName=fdRef.current.bizName||"Business";
    var mos=cfRows.map(function(r){return r.month.replace("Month ","M");});

    function buildExcel(){
      var XLSX=window.XLSX;
      if(!XLSX){alert("Excel library not loaded. Please try again.");return;}
      var wb=XLSX.utils.book_new();
      var data=[];
      var header=[""].concat(mos).concat(["Total"]);
      function dr(label,vals,opts){
        opts=opts||{};
        var tot=vals.reduce(function(a,b){return a+(b||0);},0);
        // Averages must not be summed - leave their Total cell blank
        return [label].concat(vals.map(function(v){return v||0;})).concat([opts.noTotal?"":tot]);
      }
      function sr(label){return [label].concat(Array(mos.length+1).fill(""));}

      data.push([bizName+" - 12 Month Cashflow Forecast"]);
      data.push([]);
      data.push(header);
      data.push(sr("KEY DRIVERS"));
      data.push(dr("Units Sold",cfRows.map(function(r){return r.units||0;})));
      data.push(dr("Avg Price",cfRows.map(function(r){return r.avgPrice||0;}),{noTotal:true}));
      data.push(dr("Avg Cost",cfRows.map(function(r){return r.avgCost||0;}),{noTotal:true}));
      data.push(sr("REVENUE"));
      data.push(dr("Products/Services",cfRows.map(function(r){return r.revProducts||0;})));
      data.push(dr("Other Revenue",cfRows.map(function(r){return r.revOther||0;})));
      data.push(dr("Total Revenue",cfRows.map(function(r){return r.revenue||0;})));
      data.push(sr("COST OF SALES"));
      data.push(dr("Cost of Sales",cfRows.map(function(r){return r.cogs||0;})));
      data.push(dr("Gross Profit",cfRows.map(function(r){return r.grossProfit||0;})));

      planChildren.push(new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:80},children:[new TextRun(Object.assign({text:"Business Plan and Cashflow Forecast",size:32,font:FONT},OWN?{}:{color:"d0b16f"}))]}));
      planChildren.push(new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:320},children:[new TextRun({text:dateStr,size:20,color:"6b7280",font:FONT})]}));
      if(planHtml){
        var strippedHtml=planHtml.replace(/<div[^>]*text-align:center[\s\S]*?<\/div>\s*<\/div>/i,"").replace(/<div[^>]*text-align:center[^>]*>[\s\S]*?<\/div>/i,"").trim();
        // Tags are stripped above, but HTML entities must also be decoded or
        // they appear literally in Word (e.g. "&amp;" instead of "&").
        // &amp; is decoded last so "&amp;lt;" correctly yields "&lt;".
        function decodeEntities(s){
          return String(s)
            .replace(/&nbsp;/g," ")
            .replace(/&lt;/g,"<")
            .replace(/&gt;/g,">")
            .replace(/&quot;/g,'"')
            .replace(/&#0?39;/g,"'")
            .replace(/&apos;/g,"'")
            .replace(/&amp;/g,"&");
        }
        var clean=decodeEntities(strippedHtml.replace(/<h2[^>]*>(.*?)<\/h2>/gi,"\n##$1\n").replace(/<h3[^>]*>(.*?)<\/h3>/gi,"\n###$1\n").replace(/<p[^>]*>(.*?)<\/p>/gi,"$1\n").replace(/<li[^>]*>(.*?)<\/li>/gi,"- $1\n").replace(/<[^>]+>/g,"").replace(/\*\*/g,""));
        clean.split("\n").forEach(function(ln){

          else if(t.startsWith("###"))planChildren.push(new Paragraph({heading:HeadingLevel.HEADING_2,spacing:{before:160,after:60},children:[new TextRun(OWN?{text:t.replace(/^###\s*/,"")}:{text:t.replace(/^###\s*/,""),bold:true,color:"374151",size:24,font:FONT})]}));
          else if(t.startsWith("- "))planChildren.push(new Paragraph({bullet:{level:0},spacing:{after:40},children:[new TextRun(OWN?{text:t.slice(2)}:{text:t.slice(2),size:20,font:FONT})]}));

      }

      // --- Section 2: Graphs (Portrait) ---
      var graphChildren=[];
      graphChildren.push(new Paragraph({pageBreakBefore:true,spacing:{after:200},children:[new TextRun(Object.assign({text:"Financial Graphs",bold:true,size:36,font:FONT},OWN?{}:{color:ACCENT}))]}));

      var CHART_COLORS=["#01236D","#D0B16F","#2A9D9F","#E97868","#5F7183","#1F5C5D","#1F7A7C","#B14A38","#8A98A6","#BFE3E1","#29384A","#BFE3E1","#E7F5F4","#E7F5F4"];

      // Shared axis helper. Always includes zero in the range so negative
      // values sit below the baseline rather than mirroring positives.
      function chartScale(vals,plotTop,plotH){
        var lo=Math.min.apply(null,vals.concat([0]));
        var hi=Math.max.apply(null,vals.concat([0]));
        if(hi===lo)hi=lo+1;
        // Round outward to a tidy step so axis labels read cleanly
        var raw=(hi-lo)/4;
        var mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
        var step=Math.ceil(raw/mag)*mag;
        if(step<1)step=1;
        lo=Math.floor(lo/step)*step;
        hi=Math.ceil(hi/step)*step;
        return {
          lo:lo, hi:hi, step:step,
          y:function(v){return plotTop+plotH-(v-lo)/(hi-lo)*plotH;}
        };
      }

      // Mirrors axisFmt() used by the on-screen charts so the same values
      // read identically in the app and the Word document.
      function axisLabel(v){
        var a=Math.abs(v);
        var sign=v<0?"-$":"$";
        if(a>=1000000)return sign+(a/1000000).toFixed(1).replace(/\.0$/,"")+"m";
        if(a>=10000)return sign+Math.round(a/1000)+"k";
        if(a>=1000)return sign+(a/1000).toFixed(1).replace(/\.0$/,"")+"k";
        return sign+Math.round(a).toLocaleString();
      }

      function drawAxes(ctx,sc,padL,plotTop,plotH,plotW,isCurrency){
        ctx.textAlign="right";
        ctx.font="10px Arial";
        for(var v=sc.lo; v<=sc.hi+sc.step/2; v+=sc.step){
          var y=sc.y(v);
          ctx.strokeStyle=(Math.abs(v)<sc.step/1000)?"#8A98A6":"#E7EAED";
          ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();
          ctx.fillStyle="#5F7183";
          ctx.fillText(isCurrency?axisLabel(v):String(Math.round(v)),padL-6,y+3);
        }
      }

      function makeBarChart(title,data,color,negColor,isCurrency){
        var canvas=document.createElement("canvas");
        var W=680,padL=64,padR=28,padT=34,padB=34;
        var plotH=210,plotW=W-padL-padR;
        canvas.width=W;canvas.height=padT+plotH+padB;
        var ctx=canvas.getContext("2d");
        ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,canvas.height);
        ctx.fillStyle="#01236D";ctx.font="bold 14px Arial";ctx.textAlign="center";
        ctx.fillText(title,W/2,20);

        var vals=data.map(function(d){return d.v;});
        var sc=chartScale(vals,padT,plotH);
        drawAxes(ctx,sc,padL,padT,plotH,plotW,isCurrency!==false);

        var zeroY=sc.y(0);
        var slot=plotW/data.length;
        var barW=Math.max(4,Math.min(34,slot*0.62));
        data.forEach(function(d,i){
          var vy=sc.y(d.v);
          var top=Math.min(zeroY,vy);
          var h=Math.max(1,Math.abs(vy-zeroY));
          var x=padL+i*slot+(slot-barW)/2;
          ctx.fillStyle=d.v<0?(negColor||"#B14A38"):(color||"#01236D");
          ctx.fillRect(x,top,barW,h);
        });

        ctx.strokeStyle="#8A98A6";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(padL,zeroY);ctx.lineTo(padL+plotW,zeroY);ctx.stroke();

        ctx.fillStyle="#5F7183";ctx.font="10px Arial";ctx.textAlign="center";
        data.forEach(function(d,i){
          ctx.fillText(d.l,padL+i*slot+slot/2,padT+plotH+14);
        });
        return canvas.toDataURL("image/png").split(",")[1];
      }

      // Two series on separate scales, matching the on-screen chart: units as
      // plain numbers on the left, sales as currency on the right. The single
      // makeBarChart could only draw one series, which is why Monthly Sales was
      // missing from the Word export.
      function makeDualBarChart(title,data,labelA,colorA,labelB,colorB){
        var canvas=document.createElement("canvas");
        var W=680,padL=64,padR=68,padT=52,padB=34;
        var plotH=210,plotW=W-padL-padR;
        canvas.width=W;canvas.height=padT+plotH+padB;
        var ctx=canvas.getContext("2d");
        ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,canvas.height);

        ctx.fillStyle="#01236D";ctx.font="bold 14px Arial";ctx.textAlign="center";
        ctx.fillText(title,W/2,20);

        // Legend
        var lgY=34, sw=11;
        ctx.font="11px Arial";
        var wA=ctx.measureText(labelA).width, wB=ctx.measureText(labelB).width;
        var totalW=sw+5+wA+18+sw+5+wB;
        var lx=(W-totalW)/2;
        ctx.fillStyle=colorA;ctx.fillRect(lx,lgY-sw+2,sw,sw);
        ctx.fillStyle="#29384A";ctx.textAlign="left";ctx.fillText(labelA,lx+sw+5,lgY);
        lx+=sw+5+wA+18;
        ctx.fillStyle=colorB;ctx.fillRect(lx,lgY-sw+2,sw,sw);
        ctx.fillStyle="#29384A";ctx.fillText(labelB,lx+sw+5,lgY);

        var scA=chartScale(data.map(function(d){return d.a;}),padT,plotH);
        var scB=chartScale(data.map(function(d){return d.b;}),padT,plotH);

        // Gridlines and left axis (units, plain numbers)
        ctx.textAlign="right";ctx.font="10px Arial";
        for(var v=scA.lo; v<=scA.hi+scA.step/2; v+=scA.step){
          var y=scA.y(v);
          ctx.strokeStyle=(Math.abs(v)<scA.step/1000)?"#8A98A6":"#E7EAED";
          ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();
          ctx.fillStyle="#5F7183";
          ctx.fillText(String(Math.round(v)),padL-6,y+3);
        }
        // Right axis (sales, currency)
        ctx.textAlign="left";
        for(var v2=scB.lo; v2<=scB.hi+scB.step/2; v2+=scB.step){
          var y2=scB.y(v2);
          ctx.fillStyle="#5F7183";
          ctx.fillText(axisLabel(v2),padL+plotW+6,y2+3);
        }

        var slot=plotW/data.length;
        var barW=Math.max(3,Math.min(16,slot*0.34));
        var gap=3;
        data.forEach(function(d,i){
          var cx=padL+i*slot+slot/2;
          var zA=scA.y(0), yA=scA.y(d.a);
          ctx.fillStyle=colorA;
          ctx.fillRect(cx-barW-gap/2,Math.min(zA,yA),barW,Math.max(1,Math.abs(yA-zA)));
          var zB=scB.y(0), yB=scB.y(d.b);
          ctx.fillStyle=colorB;
          ctx.fillRect(cx+gap/2,Math.min(zB,yB),barW,Math.max(1,Math.abs(yB-zB)));
        });

        ctx.strokeStyle="#8A98A6";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(padL,scA.y(0));ctx.lineTo(padL+plotW,scA.y(0));ctx.stroke();

        ctx.fillStyle="#5F7183";ctx.font="10px Arial";ctx.textAlign="center";
        data.forEach(function(d,i){
          ctx.fillText(d.l,padL+i*slot+slot/2,padT+plotH+14);

      function makeLineChart(title,data,color,negColor,isCurrency){

        var slot=plotW/data.length;
        var pts=data.map(function(d,i){

        });

        ctx.fillStyle="#5F7183";ctx.font="10px Arial";ctx.textAlign="center";
        data.forEach(function(d,i){
          ctx.fillText(d.l,padL+i*slot+slot/2,padT+plotH+14);

      function makePieChart(title,pieData){
        var total=pieData.reduce(function(s,d){return s+d.v;},0);
        if(!total)return null;
        // Height grows with the legend so many categories never overflow
        var rowH=19, legendTop=44;
        var W=680;
        var H=Math.max(260, legendTop+pieData.length*rowH+24);
        var canvas=document.createElement("canvas");
        canvas.width=W;canvas.height=H;
        var ctx=canvas.getContext("2d");
        ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,H);
        ctx.fillStyle="#01236D";ctx.font="bold 14px Arial";ctx.textAlign="center";
        ctx.fillText(title,W/2,20);

        var r=Math.min(96,(H-legendTop-30)/2);
        var cx=30+r, cy=legendTop+r+4;
        var angle=-Math.PI/2;
        pieData.forEach(function(d,i){
          var slice=d.v/total*Math.PI*2;
          ctx.fillStyle=CHART_COLORS[i%CHART_COLORS.length];
          ctx.beginPath();ctx.moveTo(cx,cy);
          ctx.arc(cx,cy,r,angle,angle+slice);
          ctx.closePath();ctx.fill();
          ctx.strokeStyle="#ffffff";ctx.lineWidth=1;ctx.stroke();
          angle+=slice;
        });

        var lx=cx+r+34;
        pieData.forEach(function(d,i){
          var y=legendTop+i*rowH;
          ctx.fillStyle=CHART_COLORS[i%CHART_COLORS.length];
          ctx.fillRect(lx,y,11,11);
          ctx.fillStyle="#29384A";ctx.font="11px Arial";ctx.textAlign="left";
          var pct=Math.round(d.v/total*100);
          var label=d.l;
          if(label.length>26)label=label.slice(0,25)+"\u2026";
          ctx.fillText(label,lx+16,y+9);
          ctx.textAlign="right";
          ctx.fillStyle="#5F7183";

      }

      if(cfRows&&cfRows.length){
        var npData=cfRows.map(function(r){return{l:shortMonth(r.month),v:r.netProfit||0};});

        var expPieRaw=expCats.map(function(c){
          var tot=cfRows.reduce(function(s,r){return s+(r.expDetail&&r.expDetail[c.id]||0);},0);
          return tot>0?{l:c.l,v:tot}:null;
        }).filter(Boolean);
        try{
          // Canvas is 680x278 for bar/line charts. Render at 468pt wide
          // (fits A4 portrait inside 0.5in margins) preserving aspect ratio.
          var CW=680, CH=278, IMG_W=468, IMG_H=Math.round(IMG_W*CH/CW);
          function pushChart(heading,b64,w,h){
            graphChildren.push(new Paragraph({spacing:{after:100},children:[new TextRun(Object.assign({text:heading,bold:true,size:22,font:FONT},OWN?{}:{color:ACCENT}))]}));
            graphChildren.push(new Paragraph({spacing:{after:240},children:[new ImageRun({data:Uint8Array.from(atob(b64),function(ch){return ch.charCodeAt(0);}),transformation:{width:w,height:h},type:"png"})]}));
          }

          pushChart("Units Sold & Monthly Sales",makeDualBarChart("Units Sold & Monthly Sales",unData,"Units Sold","#01236D","Monthly Sales ($)","#2A9D9F"),IMG_W,Math.round(IMG_W*296/CW));

          if(expPieRaw.length){
            var pieRowH=19, pieTop=44;
            var pieCH=Math.max(260,pieTop+expPieRaw.length*pieRowH+24);
            var expImg=makePieChart("Expenses Breakdown",expPieRaw);
            if(expImg)pushChart("Expenses Breakdown",expImg,IMG_W,Math.round(IMG_W*pieCH/CW));

          pushChart("Net Profit / (Loss)",makeLineChart("Net Profit / (Loss)",npData,"#2A9D9F","#B14A38",true),IMG_W,IMG_H);

      }

      // --- Section 3: Cashflow (Landscape) ---

  function clearDevice(){
    if(!window.confirm("Clear everything from this computer?\n\nThis removes your plan and signs you out. Next time you will need to enter your email at b-plandiy.com/verify.html to get back in.\n\nUse this on a shared or public computer. Export a backup first if you want to keep your work."))return;
    try{
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem("bpg_step");
      localStorage.removeItem("bpd_access_expiry");
      localStorage.removeItem("bpd_access_token");
      localStorage.removeItem("bpd_seen_welcome");
      localStorage.removeItem("bpd_seen_finances");
      localStorage.removeItem("bpg_admin_msg");
      localStorage.removeItem("bpg_ggc");
    }catch(e){}
    window.location.href="https://b-plandiy.com/";
  }

  function exportData(){
    try{
      // Users were opening the downloaded file expecting a document and getting
      // a File Conversion dialog. Putting instructions in the first lines of the
      // file means anyone who does open it sees an explanation straight away.
      var data={};
      for(var k in fdRef.current){ if(k!=="_README"&&k!=="_HOW_TO_RESTORE") data[k]=fdRef.current[k]; }
      var payload=JSON.stringify(Object.assign({
        _README:"This is a B-PlanDIY backup file. It is not a document - there is nothing to read here.",
        _HOW_TO_RESTORE:"Go to b-plandiy.com/app.html, click 'Import data' at the bottom of the screen, and choose this file. Do not edit this file."
      },data),null,2);
      var blob=new Blob([payload],{type:"application/octet-stream"});
      var name=(fdRef.current.bizName||"business").replace(/[^a-z0-9]/gi,"-").toLowerCase();
      var stamp=new Date().toISOString().slice(0,10);
      var fname="bplandiy-backup-"+name+"-"+stamp+".json";
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=fname;
      document.body.appendChild(a);a.click();
      document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
      setBackupName(fname);
      setShowBackupHelp(true);
    }catch(e){alert("Could not create the backup file. Please try again.");}
  }

  function importData(){
    var picker=document.createElement("input");
    picker.type="file";
    // No accept filter - show all files, so backups that lost their .json
    // extension (renamed, or saved as .txt) can still be selected.
    picker.onchange=function(){
      var file=picker.files&&picker.files[0];
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(){
        try{
          var data=JSON.parse(reader.result);
          if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("bad shape");
          if(!window.confirm("This will replace everything currently in the app with the contents of your backup file. Continue?"))return;
          delete data._README; delete data._HOW_TO_RESTORE;
          // Backups taken before the registration checkbox existed need the
          // same one-time inference as plans loaded from storage.
          if(data.taxRegistered===undefined){
            data.taxRegistered=((parseFloat(data.taxRate)||0)>0)?"1":"";
          }
          repairMonthGrids(data);
          fdRef.current=data;
          saveToStorage();
          setLegalStatus(data.legalStatus||"");
          setTaxReg(data.taxRegistered==="1");
          setBizDate(data.bizDate||"");
          setBrandLogo(data.brandLogo||"");setBrandColour(data.brandColour||"");setUseOwnStyles(data.brandOwnStyles==="1");
          setGoals(Array.from({length:6},function(_,i){return data["goal"+(i+1)]||"";}));
          setLiveRows(calcCashflow(data));
          setShowDirection(false);setShowOutput(false);
          setStepAndSave(0);
          window.scrollTo(0,0);
          alert("Backup restored successfully.");
        }catch(err){
          alert("That file could not be read. Please choose a backup file created by the Export button.");
        }
      };
      reader.onerror=function(){alert("Could not read that file. Please try again.");};
      reader.readAsText(file);
    };
    picker.click();
  }

  function goalSalesMap(){
    var m={};
    String(fdRef.current.goalSalesLines||"").split("|").filter(Boolean).forEach(function(p){
      var b=p.split(":");
      var i=parseInt(b[0]);
      if(!isNaN(i))m[i]=(b[1]||"").trim();
    });
    return m;
  }
  function goalSalesFor(gi){ return goalSalesMap()[gi]||""; }
  function goalSalesSum(){
    var m=goalSalesMap(),t=0;
    Object.keys(m).forEach(function(k){var n=parseFloat(m[k]);if(!isNaN(n))t+=n;});
    return t;
  }
  function writeGoalSales(map,remount){
    fdRef.current.goalSalesLines=Object.keys(map)
      .filter(function(k){return String(map[k]).length;})
      .map(function(k){return k+":"+map[k];}).join("|");
    // Mirror the sum so Step 5 and the plan prompt still read one figure.
    var t=0;
    Object.keys(map).forEach(function(k){var n=parseFloat(map[k]);if(!isNaN(n))t+=n;});
    fdRef.current.goalSalesTotal=t?String(Math.round(t)):"";
    saveToStorage();refreshLive();
    // Only remount when values are replaced wholesale (the AI button). Doing it
    // on every keystroke destroyed the input the user was typing into.
    if(remount)setGsVersion(function(v){return v+1;});
  }
  function setGoalSalesFor(gi,val){
    var m=goalSalesMap();
    m[gi]=String(val).replace(/[^0-9.-]/g,"");
    writeGoalSales(m);
  }

  function goalExpMap(){
    var m={};
    String(fdRef.current.goalExpLines||"").split("|").filter(Boolean).forEach(function(p){
      var b=p.split(":");
      if(b.length>=3){
        var gi=parseInt(b[0]);
        // Fourth part is the start month, used for salaries that begin partway
        // through the year. Absent means the whole 12 months.
        if(!isNaN(gi))m[gi]={id:(b[1]||"").trim(),amt:(b[2]||"").trim(),start:(b[3]||"").trim()};
      }
    });
    return m;
  }
  function goalExpFor2(gi){ return goalExpMap()[gi]||{id:"",amt:"",start:""}; }
  function writeGoalExp(map,remount){
    fdRef.current.goalExpLines=Object.keys(map)
      .filter(function(k){return map[k]&&(map[k].id||String(map[k].amt).length);})
      .map(function(k){return k+":"+map[k].id+":"+map[k].amt+":"+(map[k].start||"");}).join("|");
    saveToStorage();refreshLive();
    if(remount)setGeVersion(function(v){return v+1;});
  }
  function setGoalExpFor(gi,id,amt,start){
    var m=goalExpMap();
    var prev=m[gi]||{};
    m[gi]={id:id,amt:String(amt).replace(/[^0-9.-]/g,""),start:(start!==undefined?start:(prev.start||""))};
    // A start month only makes sense for a salary
    if(!PEOPLE_CATS[id])m[gi].start="";
    writeGoalExp(m);
  }
  function goalExpMonthsFor(row){
    var s=parseInt(row.start);
    if(isNaN(s)||s<1||s>12)return 12;
    return 12-s+1;
  }
  // The 12-month cost. A salary starting in month 7 costs half its annual value.
  function goalExpRowCost(row){
    var n=parseFloat(row.amt);
    if(isNaN(n))return 0;
    return n*goalExpMonthsFor(row)/12;
  }
  function goalExpTotalSum(){
    var m=goalExpMap(),t=0;
    Object.keys(m).forEach(function(k){t+=goalExpRowCost(m[k]);});
    return t;
  }
  // Aggregated by category, for the Step 5 summary and the cashflow.
  function goalExpByCategory(){
    var m=goalExpMap(),out={};
    Object.keys(m).forEach(function(k){
      var r=m[k];
      if(r.id)out[r.id]=(out[r.id]||0)+goalExpRowCost(r);
    });
    return out;
  }

  // Months where the unit cost is at or above the sale price - every sale in
  // those months makes a loss before any expenses are counted.
  function lossMakingMonths(){
    return (liveRows||[]).filter(function(r){
      // Both figures must be present, or the warning fires while the form is
      // still being filled in and a blank price reads as a zero-price sale.
      return (r.units||0)>0 && (r.avgCost||0)>0 && (r.avgPrice||0)>0 && (r.avgCost||0)>=(r.avgPrice||0);
    });
  }

  // Live result of what has been entered so far. Without this you fill in ~33
  // numbers with no feedback until you switch to the Cashflow tab.
  // Labels the dropdown with real months when a cashflow start date is set.
  function monthNameFor(m){
    var SM=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var p=String(fdRef.current.cfStartDate||"").split("-");
    var y=parseInt(p[0]),sm=parseInt(p[1]);
    if(!y||!sm||sm<1||sm>12)return "month "+m;
    var idx=(sm-1+(m-1))%12;
    var yr=y+Math.floor((sm-1+(m-1))/12);
    return SM[idx]+" "+String(yr).slice(2);
  }

  // Compact version for tight grids: real months once a cashflow start date is
  // set, M1..M12 until then. Matches the labelling MonthGrid uses.
  function shortMonthFor(m){
    var SM=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var p=String(fdRef.current.cfStartDate||"").split("-");
    var y=parseInt(p[0]),sm=parseInt(p[1]);
    if(!y||!sm||sm<1||sm>12)return "M"+m;
    var idx=(sm-1+(m-1))%12;
    var yr=y+Math.floor((sm-1+(m-1))/12);
    return SM[idx]+" "+String(yr).slice(2);
  }

  // Storage key per category. xTeam keeps its original key so existing plans
  // and backups keep working.
  function peopleKey(cat){ return cat==="xTeam"?"teamLines":cat+"Lines"; }
  function teamRows(cat){
    var rows=String(fdRef.current[peopleKey(cat)]||"").split("|").filter(Boolean).map(function(p){
      var b=p.split(":");
      // "name:amount:startMonth" - older two-part rows default to month 1
      return {name:(b[0]||"").trim(),amt:(b[1]||"").trim(),start:(b[2]||"").trim()};
    });
    return rows.length?rows:[{name:"",amt:"",start:""}];
  }
  function writeTeamRows(cat,rows,remount){
    fdRef.current[peopleKey(cat)]=rows.filter(function(r){return r.name||r.amt;})
      .map(function(r){return r.name.replace(/[:|]/g,"")+":"+r.amt+":"+(r.start||"");}).join("|");
    saveToStorage();refreshLive();
    if(remount)setAvgSalesVer(function(v){return v+1;});
  }
  // Months this person is actually paid within the 12-month forecast. Blank
  // start means they are there from the beginning, so the full year.
  function teamMonths(r){
    var s=parseInt(r.start);
    if(isNaN(s)||s<1||s>12)return 12;
    return 12-s+1;
  }
  // The amount entered is an annual salary, so a mid-year start is pro-rated.
  function teamRowCost(r){
    var n=parseFloat(r.amt);
    if(isNaN(n))return 0;
    return n*teamMonths(r)/12;
  }
  // Cost in each of the 12 months. A flat annual-total-over-12 would put a
  // later hire's salary into months they are not employed, which is exactly
  // what a cashflow forecast needs to get right.
  function teamMonthlyCosts(cat){
    var rows=teamRows(cat);
    return Array.from({length:12},function(_,i){
      var m=i+1;
      return rows.reduce(function(s,r){
        var n=parseFloat(r.amt);
        if(isNaN(n))return s;
        var st=parseInt(r.start);
        if(isNaN(st)||st<1||st>12)st=1;
        return s+(m>=st?n/12:0);
      },0);
    });
  }
  function teamCostsVary(cat){
    var a=teamMonthlyCosts(cat).map(function(v){return Math.round(v);});
    return a.some(function(v){return v!==a[0];});
  }

  function teamAnnualTotal(cat){
    return teamRows(cat).reduce(function(s,r){return s+teamRowCost(r);},0);
  }
  function goalTeamHires(cat){
    var m=goalExpMap(),out=[];
    Object.keys(m).forEach(function(k){
      var r=m[k];
      if(r.id===cat&&parseFloat(r.amt))out.push({goal:parseInt(k),row:r});
    });
    return out;
  }

  // Shared by Team and Contractors - same shape, different wording.
  var PEOPLE_CATS={
    xTeam:{word:"team member",   instr:"List each person and their annual salary. If someone starts partway through, set their start month and we will only count the months they are paid."},
    xCon: {word:"contractor",    instr:"List each contractor and what they will be paid over a full year. If one starts partway through, set their start month and we will only count the months they are engaged."}
  };
  function speechSupported(){
    try{ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }catch(e){ return false; }
  }
  function bumpVoice(id){
    setVoiceVer(function(p){var n=Object.assign({},p);n[id]=(n[id]||0)+1;return n;});
  }
  function stopRecording(){
    try{ if(recRef.current){recRef.current.stop();recRef.current=null;} }catch(e){}
    setRecKey("");
  }
  function startRecording(id){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR)return;
    stopRecording();
    var r=new SR();
    r.lang="en-NZ";
    r.continuous=true;
    r.interimResults=false;
    r.onresult=function(ev){
      var said="";
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        if(ev.results[i].isFinal)said+=ev.results[i][0].transcript;
      }
      if(!said.trim())return;
      // Append rather than replace, so a second burst of dictation adds to what
      // is already there instead of wiping it.
      var cur=fdRef.current[id]||"";
      fdRef.current[id]=(cur?cur.replace(/\s*$/,"")+" ":"")+said.trim();
      saveToStorage();
      bumpVoice(id);
    };
    r.onerror=function(){ stopRecording(); };
    r.onend=function(){ setRecKey(""); recRef.current=null; };
    recRef.current=r;
    setRecKey(id);
    try{ r.start(); }catch(e){ stopRecording(); }
  }

  async function tidyField(id){
    var cur=(fdRef.current[id]||"").trim();
    if(!cur)return;
    setTidyKey(id);
    setUndoText(function(p){var n=Object.assign({},p);n[id]=cur;return n;});
    var prompt="The text below was dictated by a business owner, so it may be unpunctuated and contain filler words.\n\n"+
      "Rewrite it as clear, well-punctuated prose.\n"+
      "- Keep the meaning, the facts and the person's own voice. Do not add anything they did not say.\n"+
      "- Remove filler like um, uh, you know, sort of, basically.\n"+
      "- Fix sentence breaks, capitals and punctuation.\n"+
      "- Keep it about the same length. Do not summarise.\n"+
      "- Reply with the tidied text only. No preamble, no quotation marks.\n\n"+
      "THE TEXT:\n"+cur;
    try{
      var res=await fetch("https://b-plandiy.com/.netlify/functions/anthropic",{method:"POST",headers:aiHeaders(),body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:900,messages:[{role:"user",content:prompt}]})});
      var data=await res.json();
      if(data.content){
        var out=data.content.map(function(x){return x.text||"";}).join("").trim();
        if(out){ fdRef.current[id]=out; saveToStorage(); bumpVoice(id); }
      }
    }catch(e){}
    setTidyKey("");
  }
  function undoTidy(id){
    var prev=undoText[id];
    if(prev===undefined)return;
    fdRef.current[id]=prev;
    saveToStorage();
    bumpVoice(id);
    setUndoText(function(p){var n=Object.assign({},p);delete n[id];return n;});
  }

  // Row of controls under a long text field.
  function VoiceTools(id){
    var has=!!(fdRef.current[id]||"").trim();
    var listening=recKey===id;
    var tidying=tidyKey===id;
    var canUndo=undoText[id]!==undefined;
    var btn={fontFamily:"inherit",fontSize:13,fontWeight:600,padding:"5px 10px",borderRadius:6,border:"1px solid #E7EAED",background:"#fff",color:"#29384A",cursor:"pointer"};
    return (
      <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginTop:5}}>
        {speechSupported()&&(
          <button style={listening?Object.assign({},btn,{background:"#B14A38",color:"#fff",border:"none"}):btn}
            onClick={function(){ listening?stopRecording():startRecording(id); }}>
            {listening?"\u25A0 Stop":"\uD83C\uDFA4 Speak"}
          </button>
        )}
        {has&&(
          <button style={tidying?Object.assign({},btn,{background:"#01236D",color:"#fff",border:"none"}):btn}
            onClick={function(){ if(!tidying)tidyField(id); }} disabled={tidying}>
            {tidying?"Tidying\u2026":"\u2728 Tidy this up"}
          </button>
        )}
        {canUndo&&!tidying&&(
          <button style={btn} onClick={function(){undoTidy(id);}}>Undo tidy</button>
        )}
        {has&&(
          <button style={Object.assign({},btn,{color:"#8A98A6"})}
            onClick={function(){ if(window.confirm("Clear this field?")){fdRef.current[id]="";saveToStorage();bumpVoice(id);} }}>Clear</button>
        )}
        {listening&&<span style={{fontSize:11,color:"#B14A38"}}>Listening&hellip; speak now</span>}
      </div>
    );
  }

  // Suggests the running cost base. Two things it must not do: duplicate costs
  // the Step 4 goals already contribute to the same categories, and hand back a
  // flat monthly figure for Team or Contractors - those two are built from
  // named people with start months, so they are suggested as rows for the
  // people helper instead.
  async function suggestExpenses(){
    setExpAiLoad(true);
    setExpAi(null);
    var goalByCat=goalExpByCategory();
    var goalOn=fdRef.current.goalExpApply==="1";
    var goalText=Object.keys(goalByCat).map(function(id){
      var m=expCats.filter(function(e){return e.id===id;})[0];
      return (m?m.l:id)+": "+fmt(Math.round(goalByCat[id]))+" a year";
    }).join("; ")||"none";
    var rate=activeTaxRate();
    var catList=expCats.filter(function(c){return !PEOPLE_CATS[c.id];})
      .map(function(c){return c.l;}).join(", ");
    var units=(liveRows||[]).reduce(function(s,r){return s+(r.units||0);},0);
    var rev=(liveRows||[]).reduce(function(s,r){return s+(r.revenue||0);},0);

    var prompt="Estimate the monthly running expenses for this business, category by category.\n\n"+
      "Business: "+(fdRef.current.bizName||"this business")+"\n"+
      "Industry: "+(fdRef.current.industry||"not specified")+"\n"+
      "Location(s): "+(fdRef.current.locations||"New Zealand")+"\n"+
      "What the business does: "+(fdRef.current.description||fdRef.current.history||"not specified")+"\n"+
      "Stage: "+(fdRef.current.stage||"not specified")+"\n"+
      "Team as it stands: "+(fdRef.current.team||fdRef.current.execTeam||"not specified")+"\n"+
      "Planned new hires: "+(fdRef.current.execTeamNew||"none stated")+"\n"+
      "Forecast sales over 12 months: "+(rev?fmt(Math.round(rev)):"not yet entered")+
        (units?(" from "+Math.round(units).toLocaleString()+" units"):"")+"\n\n"+
      "ALREADY COUNTED - do not include these again. The Step 4 goals add the following"+
        (goalOn?"":" (currently switched off, but still do not duplicate them)")+":\n"+goalText+"\n"+
      "Suggest only the ordinary running costs the business would carry anyway, on top of those.\n\n"+
      "Categories to use, and no others: "+catList+"\n"+
      "Give a MONTHLY figure in New Zealand dollars for each category that genuinely applies. Omit a category entirely rather than guessing a token amount.\n"+
      (rate>0
        ? "The business is registered for GST, so give every figure EXCLUDING tax.\n"
        : "The business is not registered for GST, so give the amounts actually paid.\n")+
      "Be realistic and conservative for a small business at this stage. A sole trader working from home has very few of these.\n\n"+
      "Then, separately, suggest the people needed. For each one give a role, an annual salary in New Zealand dollars, and the month of the 12 they start (1 if from the beginning). Use PERMANENT for employees and CONTRACT for contractors. If none are needed, write PEOPLE: none.\n\n"+
      "Reply in EXACTLY this format and nothing else:\n"+
      "EXPENSE: [category name] | [monthly amount, digits only] | [max 12 words on what it covers]\n"+
      "(one EXPENSE line per category)\n"+
      "PEOPLE: [PERMANENT or CONTRACT] | [role] | [annual salary, digits only] | [start month 1-12] | [max 10 words why]\n"+
      "(one PEOPLE line per person, or the single line PEOPLE: none)";
    try{
      var res=await fetch("https://b-plandiy.com/.netlify/functions/anthropic",{method:"POST",headers:aiHeaders(),body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:900,messages:[{role:"user",content:prompt}]})});
      var data=await res.json();
      var text=(data.content||[]).map(function(x){return x.text||"";}).join("");
      var cats=[],people=[];
      text.split("\n").forEach(function(line){
        var em=line.match(/EXPENSE:\s*([^|]+)\|\s*\$?\s*([0-9][0-9,]*\.?[0-9]*)\s*\|?\s*(.*)$/i);
        if(em){
          var name=em[1].replace(/[^a-z &]/gi,"").trim().toLowerCase();
          var cat=expCats.filter(function(e){return e.l.toLowerCase()===name;})[0];
          if(!cat)cat=expCats.filter(function(e){return e.l.toLowerCase().indexOf(name)>=0||name.indexOf(e.l.toLowerCase())>=0;})[0];
          var amt=parseFloat(em[2].replace(/,/g,""));
          // A zero is dropped rather than stored. Writing "0" into a category
          // reveals its row and prints a "12-month total: $0" line for a cost
          // that does not exist - the model was asked to omit these, but it
          // sometimes answers 0 instead.
          if(cat&&!PEOPLE_CATS[cat.id]&&!isNaN(amt)&&amt>0){
            cats.push({id:cat.id,label:cat.l,amt:amt,why:(em[3]||"").trim()});
          }
          return;
        }
        var pm=line.match(/PEOPLE:\s*(PERMANENT|CONTRACT)\s*\|\s*([^|]+)\|\s*\$?\s*([0-9][0-9,]*\.?[0-9]*)\s*\|\s*([0-9]{1,2})\s*\|?\s*(.*)$/i);
        if(pm){
          var start=parseInt(pm[4]);
          if(isNaN(start)||start<1||start>12)start=1;
          var pamt=parseFloat(pm[3].replace(/,/g,""));
          if(!isNaN(pamt)&&pamt>0){
            people.push({
              cat:/PERMANENT/i.test(pm[1])?"xTeam":"xCon",
              name:pm[2].trim(),
              amt:pamt,
              start:start,
              why:(pm[5]||"").trim()
            });
          }
        }
      });
      if(!cats.length&&!people.length){
        setExpAi({error:"Could not work out any figures just now. Please try again."});
      } else {
        // Anything already filled in is left unticked, so a typed figure is
        // never replaced without the user deliberately choosing it.
        var pick={};
        cats.forEach(function(c){ pick["c:"+c.id]=!fdRef.current[c.id]; });
        people.forEach(function(p,i){ pick["p:"+i]=true; });
        setExpAiPick(pick);
        setExpAi({cats:cats,people:people});
      }
    }catch(e){ setExpAi({error:"Could not get suggestions just now. Please try again."}); }
    setExpAiLoad(false);
  }

  // Preview only. Rows are applied on Add, never on arrival.

  function applyExpenseSuggestions(){
    if(!expAi||expAi.error)return;
    (expAi.cats||[]).forEach(function(c){
      if(!expAiPick["c:"+c.id])return;
      if(!(c.amt>0))return;
      fdRef.current[c.id]=String(Math.round(c.amt));
      // Any monthly grid for this category is stale now, so close it and fall
      // back to the flat figure rather than leaving the two disagreeing.
      fdRef.current[c.id+"_monthly"]="";
      setGridChecks(function(p){var n=Object.assign({},p);n[c.id]=false;return n;});
      revealExp(c.id);
    });
    // People are appended to the existing helper rows rather than replacing
    // them, so anyone already listed is kept.
    var byCat={};
    (expAi.people||[]).forEach(function(p,i){
      if(!expAiPick["p:"+i])return;
      if(!byCat[p.cat])byCat[p.cat]=[];
      byCat[p.cat].push(p);
    });
    Object.keys(byCat).forEach(function(cat){
      var rows=teamRows(cat).filter(function(r){return r.name||r.amt;});
      byCat[cat].forEach(function(p){
        rows.push({name:p.name,amt:String(Math.round(p.amt)),start:p.start>1?String(p.start):""});
      });
      writeTeamRows(cat,rows,true);
      // Push the pro-rated monthly cost into the category, as "Use this figure"
      // does, so the forecast reflects the new people immediately.
      var mc=teamMonthlyCosts(cat);
      if(teamCostsVary(cat)){
        fdRef.current[cat]=mc.map(function(v,i){return "M"+(i+1)+":"+Math.round(v);}).join(",");
        fdRef.current[cat+"_monthly"]="1";
        setGridChecks(function(p){var n=Object.assign({},p);n[cat]=true;return n;});
      } else {
        fdRef.current[cat]=String(Math.round(mc[0]));
        fdRef.current[cat+"_monthly"]="";
        setGridChecks(function(p){var n=Object.assign({},p);n[cat]=false;return n;});
      }
      revealExp(cat);
    });
    saveToStorage();refreshLive();
    setExpAi(null);
    setAvgSalesVer(function(v){return v+1;});
  }

  // Cost of sales only - what it takes to deliver one unit. Overheads belong in
  // the expense categories, and counting them here would double up.
  async function suggestAvgCost(){
    setAcAiLoad(true);
    setAcAi(null);
    var prompt="Suggest a realistic average cost per unit for this business - the direct cost of delivering one sale.\n\n"+
      "Business: "+(fdRef.current.bizName||"this business")+"\n"+
      "Industry: "+(fdRef.current.industry||"not specified")+"\n"+
      "Location(s): "+(fdRef.current.locations||"New Zealand")+"\n"+
      "What the business does: "+(fdRef.current.description||fdRef.current.history||"not specified")+"\n"+
      "Target customer: "+(fdRef.current.targetCust||"not specified")+"\n"+
      "Stage: "+(fdRef.current.stage||"not specified")+"\n"+
      "Average sale price per unit, if entered: "+(fdRef.current.avgPrice||"not entered")+"\n\n"+
      "A \"unit\" is one sale - for a service business that may be an hour, a job or a monthly subscription.\n"+
      "Count ONLY direct cost of sales: materials, stock bought in, packaging, freight, subcontracted labour for that job, payment fees.\n"+
      "Do NOT include rent, salaries of permanent staff, insurance, marketing, accounting or any other overhead - those are entered separately as expenses, and counting them here would double up.\n"+
      "Many service businesses have little or no direct unit cost. If that is the case here, say 0 rather than inventing one.\n"+
      (activeTaxRate()>0
        ? "Give the price INCLUDING GST, as a supplier would quote it in New Zealand. Do not deduct GST yourself.\n"
        : "Give the amount actually paid. This business is not registered for GST.\n")+
      "If a sale price is given above, the cost must sit below it.\n\n"+
      "Reply in EXACTLY this format and nothing else:\n"+
      "COST: [number only, no dollar sign, no commas]\n"+
      "UNIT: [what one unit is, 2-5 words]\n"+
      "WHY: [one or two short sentences on what the figure covers and what it assumes]";
    try{
      var res=await fetch("https://b-plandiy.com/.netlify/functions/anthropic",{method:"POST",headers:aiHeaders(),body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,messages:[{role:"user",content:prompt}]})});
      var data=await res.json();
      var text=(data.content||[]).map(function(x){return x.text||"";}).join("");
      var cm=text.match(/COST:\s*\$?\s*([0-9][0-9,]*\.?[0-9]*)/i);
      var um=text.match(/UNIT:\s*(.+)/i);
      var wm=text.match(/WHY:\s*([\s\S]+)/i);
      if(cm){
        var grossC=parseFloat(cm[1].replace(/,/g,""));
        setAcAi({
          gross:grossC,
          cost:exclOfTax(grossC),
          rate:activeTaxRate(),
          unit:um?um[1].trim():"",
          why:wm?wm[1].trim():""
        });
      } else {
        setAcAi({error:"Could not work out a figure just now. Please try again."});
      }
    }catch(e){ setAcAi({error:"Could not get a suggestion just now. Please try again."}); }
    setAcAiLoad(false);
  }

  // Weighted average across a product mix: total money divided by total units,
  // NOT the average of the per-unit prices. Averaging the prices would weight a
  // product selling 400 units the same as one selling 6,000.
  function mixTotals(rows){
    var qty=0,money=0,used=0;
    (rows||[]).forEach(function(r){
      var q=parseFloat(String(r.qty).replace(/[^0-9.]/g,""));
      var a=parseFloat(String(r.amt).replace(/[^0-9.]/g,""));
      if(isNaN(q)||q<=0||isNaN(a))return;
      qty+=q;money+=q*a;used++;
    });
    return {qty:qty,money:money,rows:used,avg:qty>0?money/qty:null};
  }

          onClick={function(){setRows(rows.concat([{name:"",qty:"",amt:""}]));}}>+ Add another</button>
        {t.avg!==null&&t.rows>0&&(
          <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #E7EAED",fontSize:13,color:"#29384A",lineHeight:1.7}}>

                  <div style={{marginBottom:4,color:"#5F7183"}}>{fmt(total)} including tax &divide; {(1+activeTaxRate()/100).toFixed(2)} = {fmt(Math.round(apNet))} excluding tax</div>
                )}
                {fmt(Math.round(apNet))} &divide; {Math.round(units).toLocaleString()} units = <strong style={{color:"#01236D",fontSize:17}}>{fmt2(Math.round(price*100)/100)}</strong> per unit
                <div style={{marginTop:10}}>
                  <button style={Object.assign({},suggestBtn,{background:"#01236D"})}
                    onClick={function(){
                      fdRef.current.avgPrice=String(Math.round(price*100)/100);

  // Only meaningful when the business is registered AND a rate has been set.
  function activeTaxRate(){
    if(!taxReg)return 0;
    var r=parseFloat(fdRef.current.taxRate)||0;
    return r>0?r:0;
  }
  function exclOfTax(v){
    var r=activeTaxRate();
    return r>0?v/(1+r/100):v;
  }

  // The converter lives inside the section reminder rather than sitting on its
  // own, so it is offered at the point the instruction is given. convOpen holds
  // the section key, so opening it in one section does not open the others.
  // Nothing is converted automatically: silently altering a typed number is
  // worse than making someone do the sum, because they cannot tell whether it
  // has been applied.
  function TaxExclNote(sectionKey,subject){
    if(!taxReg)return null;
    var rate=activeTaxRate();
    var open=convOpen===sectionKey;
    var raw=parseFloat(String(convAmt).replace(/[^0-9.-]/g,""));
    var ok=!isNaN(raw)&&raw!==0;
    var excl=ok?exclOfTax(raw):null;
    return (
      <div style={{fontSize:13,color:"#1F5C5D",background:"#E7F5F4",border:"1px solid #BFE3E1",borderLeft:"3px solid #D0B16F",borderRadius:6,padding:"8px 11px",marginBottom:12,lineHeight:1.5}}>
        <div style={{display:"flex",gap:12,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap"}}>
          <span style={{flex:"1 1 240px",minWidth:0}}>
            {subject||"Amounts"} in this section should <strong style={{color:"#01236D"}}>exclude</strong> product/services tax.
          </span>
          {rate>0&&(
            <button style={{fontFamily:"inherit",fontSize:13,fontWeight:600,flexShrink:0,marginLeft:"auto",
              padding:"6px 12px",borderRadius:6,cursor:"pointer",
              border:"1px solid "+(open?"#01236D":"#D0B16F"),
              background:open?"#01236D":"#fff",color:open?"#fff":"#01236D"}}
              onClick={function(){setConvOpen(open?"":sectionKey);setConvAmt("");}}>
              {open?"Close":"Take the tax off an amount"}
            </button>
          )}
        </div>
        {open&&(
          <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #BFE3E1"}}>
            <div style={{marginBottom:6}}>If you know a figure with tax included, put it in here and use the amount that comes out.</div>
            <div style={{fontSize:13,color:"#29384A",marginBottom:4}}>Amount including tax ($)</div>
            <input style={Object.assign({},inp,{fontSize:15,maxWidth:220})} placeholder="e.g. 115" value={convAmt}
              onChange={function(e){setConvAmt(e.target.value);}}/>
            {ok&&(
              <div style={{marginTop:10,fontSize:13,color:"#29384A",lineHeight:1.7}}>
                {fmt(raw)} &divide; {(1+rate/100).toFixed(2)} = <strong style={{color:"#01236D",fontSize:17}}>{fmt2(Math.round(excl*100)/100)}</strong> excluding tax
                <div style={{fontSize:13,color:"#5F7183",marginTop:3}}>The tax portion is {fmt(Math.round((raw-excl)*100)/100)} at {rate}%.</div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  }

  function FinSummary(){
    if(!liveRows||!liveRows.length)return null;
    var closing=liveRows[liveRows.length-1].closingBalance||0;
    var low=liveRows[0],lowV=liveRows[0].closingBalance||0;
    liveRows.forEach(function(r){ if((r.closingBalance||0)<lowV){lowV=r.closingBalance||0;low=r;} });
    var rev=liveRows.reduce(function(s,r){return s+(r.revenue||0);},0);
    var np=liveRows.reduce(function(s,r){return s+(r.netProfit||0);},0);
    var neg=lowV<0;
    return (
      <div style={{position:"sticky",top:0,zIndex:5,background:neg?"#FDEEEB":"#E7F5F4",border:"1px solid "+(neg?"#F2CFC7":"#BFE3E1"),borderRadius:12,padding:"10px 14px",marginBottom:14,display:"flex",gap:18,flexWrap:"wrap",alignItems:"center"}}>
        <div><div style={{fontSize:11,color:"#5F7183",textTransform:"uppercase",letterSpacing:"0.05em"}}>12-month revenue</div><div style={{fontSize:18,fontWeight:700,color:"#01236D"}} className="bpd-num bpd-pop">{fmt(rev)}</div></div>
        <div><div style={{fontSize:11,color:"#5F7183",textTransform:"uppercase",letterSpacing:"0.05em"}}>Net profit / (loss)</div><div style={{fontSize:18,fontWeight:700,color:np<0?"#B14A38":"#1F7A7C"}} className="bpd-num bpd-pop">{fmt(np)}</div></div>
        <div><div style={{fontSize:11,color:"#5F7183",textTransform:"uppercase",letterSpacing:"0.05em"}}>Closing balance</div><div style={{fontSize:15,fontWeight:700,color:closing<0?"#B14A38":"#1F7A7C"}}>{fmt(closing)}</div></div>
        <div><div style={{fontSize:11,color:"#5F7183",textTransform:"uppercase",letterSpacing:"0.05em"}}>Lowest month</div><div style={{fontSize:18,fontWeight:700,color:neg?"#B14A38":"#1F7A7C"}} className="bpd-num bpd-pop">{fmt(lowV)} <span style={{fontSize:11,fontWeight:500,color:"#5F7183"}}>{low.month}</span></div></div>
        {neg&&<div style={{fontSize:11,color:"#B14A38",flex:"1 1 200px",lineHeight:1.45}}>Cash goes negative in {low.month}. You may need funding, or to reduce costs, before then.</div>}
        {taxReg&&!((parseFloat(fdRef.current.taxRate)||0)>0)&&(
          <div style={{fontSize:11,color:"#B14A38",fontWeight:700,flex:"1 1 200px",lineHeight:1.45}}>
            No tax rate entered in section 3, so no tax is included. These figures overstate your cash.
          </div>
        )}
      </div>
    );
  }

            <button key={i} onClick={function(){setShowDirection(false);setStepAndSave(i);}}

            </button>
          );
        })}
      </div>
    );
  }
