            {label:"Graphs",action:function(){setShowDirection(false);setStepAndSave(4);setTimeout(function(){setPreviewTab("graphs");},50);}},
            {label:"What If",action:function(){setShowDirection(false);setStepAndSave(4);setTimeout(function(){setPreviewTab("whatif");},50);}},
          ].map(function(item){return <button key={item.label} onClick={item.action} style={Object.assign({fontFamily:"inherit",fontSize:14,fontWeight:700,padding:"11px 20px",borderRadius:10,cursor:"pointer",whiteSpace:"nowrap"}, item.label==="Summary"?{background:"#01236D",color:"#fff",border:"1px solid #01236D"}:{background:"#fff",color:"#01236D",border:"1px solid #E7EAED"})}>{item.label}</button>;})}
        </div>
        <BackupNote/><BackupHelp/>{WelcomeScreen()}{FinancesIntro()}
        <div style={cardStyle}>
          {StepNav(stepDefs.length)}
          <div style={{fontSize:11,fontWeight:700,color:"#8A98A6",letterSpacing:"0.09em",textTransform:"uppercase",marginBottom:8}}>Summary</div>
          <div style={{fontSize:26,fontWeight:800,color:"#01236D",marginBottom:10,lineHeight:1.2,letterSpacing:"-0.01em"}}>Business Direction<div style={{width:56,height:3,background:"#D0B16F",borderRadius:2,marginTop:9}}/></div>
          <div style={{fontSize:15,color:"#5F7183",marginBottom:20,lineHeight:1.6}}>Here is a summary of the key information for your business.</div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
            <button style={{fontFamily:"inherit",fontSize:15,fontWeight:600,padding:"11px 20px",borderRadius:10,border:"1px solid #E7EAED",background:"#fff",color:"#29384A",cursor:"pointer"}} onClick={function(){setShowDirection(false);}}>&larr; Back</button>
            <button style={{fontFamily:"inherit",fontSize:15,fontWeight:700,padding:"12px 26px",borderRadius:10,border:"none",background:"#01236D",color:"#fff",cursor:"pointer",marginLeft:"auto",display:"inline-flex",alignItems:"center",gap:10}} onClick={function(){generatePlan();setShowOutput(true);setShowDirection(false);}}>Generate Business Plan <span style={{fontSize:18,lineHeight:1}}>&rarr;</span></button>
          </div>
          {[
            {label:"Vision",val:f.vision},
            {label:"Position Statement",val:f.position},
            {label:"Values",val:f.values},
            {label:"Target Customer/Market",val:f.targetCust},
            {label:"Target Market Opportunity",val:f.marketSize},
            {label:"Main Competitors",val:f.competitors},
            {label:"Competitive Advantage",val:f.advantage},
          ].map(function(item){return (
            <div key={item.label} style={{marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700,color:"#01236D",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4}}>{item.label}</div>
              <div style={{background:"#FCFCFA",border:"1px solid #E7EAED",borderRadius:6,padding:"10px 12px",fontSize:15,color:item.val?"#29384A":"#8A98A6",minHeight:36,whiteSpace:"pre-wrap"}}>{item.val||"Not yet completed"}</div>
            </div>
          );})}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,color:"#01236D",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4}}>Goals</div>
            <div style={{background:"#FCFCFA",border:"1px solid #E7EAED",borderRadius:6,padding:"10px 12px",fontSize:15,color:"#29384A",minHeight:36}}>
              {Array.from({length:6},function(_,i){var g=f["goal"+(i+1)];return g?<div key={i} style={{marginBottom:4}}><strong>{i+1}.</strong> {g}</div>:null;}).filter(Boolean).length>0
                ?Array.from({length:6},function(_,i){var g=f["goal"+(i+1)];return g?<div key={i} style={{marginBottom:4}}><strong>{i+1}.</strong> {g}</div>:null;})
                :<span style={{color:"#8A98A6"}}>Not yet completed</span>}
            </div>
          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:13,fontWeight:700,color:"#01236D",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4}}>How Going to Achieve Goals</div>
            <div style={{background:"#FCFCFA",border:"1px solid #E7EAED",borderRadius:6,padding:"10px 12px",fontSize:15,color:"#29384A",minHeight:36}}>
              {Array.from({length:6},function(_,i){
                var g=f["goal"+(i+1)],h=f["goalHow"+(i+1)],r=f["goalRes"+(i+1)];
                return g?<div key={i} style={{marginBottom:10}}>
                  <div style={{fontWeight:600}}>{i+1}. {g}</div>
                  {h&&<div style={{marginLeft:12,color:"#29384A"}}><span style={{color:"#5F7183"}}>How:</span> {h}</div>}
                  {r&&<div style={{marginLeft:12,color:"#29384A"}}><span style={{color:"#5F7183"}}>Resources:</span> {r}</div>}
                </div>:null;
              }).filter(Boolean).length>0
                ?Array.from({length:6},function(_,i){
                  var g=f["goal"+(i+1)],h=f["goalHow"+(i+1)],r=f["goalRes"+(i+1)];
                  return g?<div key={i} style={{marginBottom:10}}>
                    <div style={{fontWeight:600}}>{i+1}. {g}</div>
                    {h&&<div style={{marginLeft:12}}><span style={{color:"#5F7183"}}>How:</span> {h}</div>}
                    {r&&<div style={{marginLeft:12}}><span style={{color:"#5F7183"}}>Resources:</span> {r}</div>}
                  </div>:null;
                })
                :<span style={{color:"#8A98A6"}}>Not yet completed</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center",marginTop:32,paddingTop:24,borderTop:"1px solid #E7EAED"}}>
            <button style={{fontFamily:"inherit",fontSize:15,fontWeight:600,padding:"13px 22px",borderRadius:10,border:"1px solid #E7EAED",background:"#fff",color:"#29384A",cursor:"pointer"}} onClick={function(){setShowDirection(false);}}>&larr; Back</button>
            <button style={{fontFamily:"inherit",fontSize:16,fontWeight:700,padding:"14px 34px",borderRadius:10,border:"none",background:"#01236D",color:"#fff",cursor:"pointer",marginLeft:"auto",display:"inline-flex",alignItems:"center",gap:10}} onClick={function(){generatePlan();setShowOutput(true);setShowDirection(false);}}>Generate Business Plan <span style={{fontSize:18,lineHeight:1}}>&rarr;</span></button>
          </div>
        </div>
        <AppFooter/>
      </div>
    );
  }

  if(showOutput){
    return (
      <div style={appStyle}>
        <div style={{display:"flex",gap:10,marginBottom:12}}>
          <button style={Object.assign({},btnSm,{background:"#01236D",color:"#fff",border:"none"})} onClick={function(){setShowOutput(false);setStepAndSave(4);}}>← Edit</button>
          {!loading&&<button style={{fontFamily:"inherit",fontSize:13,fontWeight:600,padding:"9px 18px",borderRadius:6,border:"none",background:"#01236D",color:"#fff",cursor:"pointer"}} onClick={function(){generateWordDoc();}}>Download Word (.docx)</button>}
        </div>
        <BackupNote/><BackupHelp/>{WelcomeScreen()}{FinancesIntro()}
        {!loading&&!!planHtml&&BrandingPanel()}
        <div style={cardStyle}>
          {tab==="plan"&&(
            <div>
              {loading&&<div style={{textAlign:"center",padding:"40px 16px",color:"#5F7183",fontSize:15}}>{loadMsg}</div>}
              {!loading&&!planHtml&&<div style={{textAlign:"center",padding:"40px 16px",color:"#5F7183",fontSize:15}}><button style={Object.assign({},btnSm,{background:"#01236D",color:"#fff",border:"none",fontSize:15,padding:"10px 20px"})} onClick={generatePlan}>Generate Business Plan</button></div>}
              {planHtml&&<div style={{overflowX:"auto",pointerEvents:"none",maxWidth:780,marginLeft:"auto",marginRight:"auto"}} dangerouslySetInnerHTML={{__html:planHtml}}/>}
              {planHtml&&liveRows&&liveRows.length>0&&(
                <div style={{marginTop:8}}>
                  <CfCharts rows={liveRows} expCatsData={expCats}/>
                </div>
              )}
              {planHtml&&liveRows&&liveRows.length>0&&(
                <div style={{marginTop:32,borderTop:"2px solid #E7F5F4",paddingTop:24}}>
                  <h2 style={{fontSize:18,fontWeight:700,color:"#01236D",marginBottom:16}}>12-Month Cashflow Forecast</h2>
                  <CfTable rows={liveRows}/>
                </div>
              )}
            </div>
          )}
          {tab==="cashflow"&&(
            <div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:20}}>
                <img src={LOGO_SRC} style={{width:44,height:44,objectFit:"contain"}} alt="Logo"/>
                <button style={{fontFamily:"inherit",fontSize:13,fontWeight:600,padding:"9px 18px",borderRadius:6,border:"none",background:"#01236D",color:"#fff",cursor:"pointer"}} onClick={function(){downloadCashflowExcel();}}>Download Excel (.xlsx)</button>
              </div>
        <div style={{display:"flex",gap:5,marginBottom:22}}>
                {["table","preview"].map(function(t){return <button key={t} style={{flex:1,height:4,borderRadius:2,background:previewTab===t?"#D0B16F":"#E7EAED",border:"none",cursor:"pointer"}} onClick={function(){setPreviewTab(t);}}/>;}) }
              </div>
              {previewTab==="table"&&<CfTable rows={liveRows}/>}
            </div>
          )}
          {tab==="graphs"&&<CfCharts rows={liveRows} expCatsData={expCats}/>}
        </div>
        {showPrint&&(
          <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",zIndex:1000,overflow:"auto"}}>
            <div style={{background:"#fff",maxWidth:860,margin:"20px auto",borderRadius:12,padding:"32px 28px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
                <button style={Object.assign({},btnSm,{background:"#01236D",color:"#fff",border:"none"})} onClick={function(){window.print();}}>Print / Save as PDF</button>
                <button style={btnSm} onClick={function(){setShowPrint(false);}}>✕ Close</button>
              </div>
              <div style={{textAlign:"center",paddingBottom:24,marginBottom:24,borderBottom:"2px solid #E7F5F4"}}>
                <div style={{fontSize:26,fontWeight:800,color:"#01236D",marginBottom:8}}>{fdRef.current.bizName||"Business Plan"}</div>
                <div style={{fontSize:15,fontWeight:500,color:"#D0B16F",marginBottom:6}}>Business Plan and Cashflow Forecast</div>
                <div style={{fontSize:13,color:"#5F7183"}}>{fmtDate(new Date().toISOString().slice(0,10))}</div>
              </div>
              {planHtml&&<div style={{overflowX:"auto",pointerEvents:"none",maxWidth:780,marginLeft:"auto",marginRight:"auto"}} dangerouslySetInnerHTML={{__html:planHtml}}/>}
            </div>
          </div>
        )}
      </div>
    );
  }
  var currentStep=stepDefs[step];
  return (
    <div style={appStyle}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:22,flexWrap:"wrap",background:"#fff",borderBottom:"2px solid #D0B16F",borderRadius:0,padding:"14px 4px 16px"}}>
        <img src={LOGO_SRC} style={{width:46,height:46,objectFit:"contain"}} alt="Logo"/>
        <span style={{fontWeight:800,color:"#01236D",fontSize:22,letterSpacing:"-0.01em",marginRight:"auto",borderBottom:"3px solid #D0B16F",paddingBottom:3,lineHeight:1.1}}>B-PlanDIY</span>
        {[
          {label:"Summary",action:function(){setShowDirection(true);setShowOutput(false);}},
          {label:"Cashflow",action:function(){setStepAndSave(4);setTimeout(function(){setPreviewTab("cashflow");},50);}},
          {label:"Graphs",action:function(){setStepAndSave(4);setTimeout(function(){setPreviewTab("graphs");},50);}},
          {label:"What If",action:function(){setStepAndSave(4);setTimeout(function(){setPreviewTab("whatif");},50);}},
        ].map(function(item){return <button key={item.label} onClick={item.action} style={Object.assign({fontFamily:"inherit",fontSize:14,fontWeight:700,padding:"11px 20px",borderRadius:10,cursor:"pointer",whiteSpace:"nowrap"}, item.label==="Summary"?Object.assign({background:"#01236D",color:"#fff",border:"1px solid #01236D"},step===stepDefs.length-1?{boxShadow:"0 0 0 3px rgba(208,177,111,0.55)"}:{}):{background:"#fff",color:"#01236D",border:"1px solid #E7EAED"})}>{item.label}</button>;})}
      </div>
      <BackupNote/><BackupHelp/>{WelcomeScreen()}{FinancesIntro()}
      <div style={cardStyle}>
        {StepNav(step)}
        <div style={{fontSize:11,fontWeight:700,color:"#8A98A6",letterSpacing:"0.09em",textTransform:"uppercase",marginBottom:8}}>{currentStep.label}</div>
        <div style={{fontSize:26,fontWeight:800,color:"#01236D",marginBottom:10,lineHeight:1.2,letterSpacing:"-0.01em"}}>{currentStep.title}<div style={{width:56,height:3,background:"#D0B16F",borderRadius:2,marginTop:9}}/></div>
        <div style={{fontSize:15,color:"#5F7183",marginBottom:26,lineHeight:1.6}}>{currentStep.desc}</div>
        {currentStep.render()}
        <div style={{display:"flex",gap:10,alignItems:"center",marginTop:32,paddingTop:24,borderTop:"1px solid #E7EAED"}}>
          {step>0&&<button style={{fontFamily:"inherit",fontSize:15,fontWeight:600,padding:"13px 22px",borderRadius:10,border:"1px solid #E7EAED",background:"#fff",color:"#29384A",cursor:"pointer"}} onClick={function(){setStepAndSave(step-1);}}>&larr; Back</button>}
          <button style={{fontFamily:"inherit",fontSize:16,fontWeight:700,padding:"14px 34px",borderRadius:10,border:"none",background:"#01236D",color:"#fff",cursor:"pointer",marginLeft:"auto",display:"inline-flex",alignItems:"center",gap:10}}
            onClick={function(){ step<stepDefs.length-1 ? setStepAndSave(step+1) : (setShowDirection(true),window.scrollTo(0,0)); }}>
            {step<stepDefs.length-1?"Next":"Review your plan"} <span style={{fontSize:18,lineHeight:1}}>&rarr;</span>
          </button>
        </div>
      </div>
      <AppFooter/>
      {adminMsg&&<div style={{background:GREEN_LIGHT,border:"1px solid "+GREEN,borderRadius:6,padding:"10px 14px",marginTop:8,fontSize:13,color:GREEN_DARK}}>{adminMsg}</div>}
      {showAdmin&&(<div style={{background:"#FCFCFA",borderRadius:6,padding:16,marginTop:8,border:"1px solid #E7EAED"}}>
        <div style={{fontSize:13,fontWeight:600,color:"#29384A",marginBottom:8}}>Admin</div>
        <input style={inp} type="password" placeholder="Password" value={adminPw} onChange={function(e){setAdminPw(e.target.value);}}/>
        {adminPw==="stratdiy2025"&&(<div style={{marginTop:8}}>
          <textarea ref={growRef} onInput={growOn} style={ta(2)} placeholder="Broadcast message to all users (leave blank to clear)" value={adminMsgInput} onChange={function(e){setAdminMsgInput(e.target.value);}}/>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button style={Object.assign({},btnSm,{background:"#01236D",color:"#fff",border:"none"})} onClick={function(){try{localStorage.setItem("bpg_admin_msg",adminMsgInput);}catch(e){}setShowAdmin(false);setAdminPw("");}}>Save & broadcast</button>
            <button style={btnSm} onClick={function(){setShowAdmin(false);setAdminPw("");}}>Cancel</button>
          </div>
        </div>)}
      </div>)}
      {showFeedback&&(
        <div className="bpd-overlay" style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(1,35,109,0.45)",display:"flex",alignItems:"center",justifyContent:"center",padding:16,zIndex:9998,overflowY:"auto"}}
          onClick={function(){setShowFeedback(false);}}>
          <div style={{background:"#fff",borderRadius:12,maxWidth:460,width:"100%",padding:"20px 22px",boxShadow:"0 10px 40px rgba(0,0,0,0.25)",margin:"auto"}}
            onClick={function(e){e.stopPropagation();}}>
            <div style={{fontSize:15,fontWeight:700,color:"#01236D",marginBottom:12}}>Give feedback</div>
            <div style={{background:"#FCFCFA",borderRadius:6,padding:16,marginTop:8,border:"1px solid #E7EAED"}}>
          {fbDone?<div style={{textAlign:"center",color:"#D0B16F",fontSize:15,padding:"8px 0"}}>Thank you for your feedback!</div>:(
            <div>
              <div style={{fontSize:13,fontWeight:500,color:"#29384A",marginBottom:8}}>How would you rate your experience?</div>
              <div style={{display:"flex",gap:6,marginBottom:12}}>
                {[1,2,3,4,5].map(function(n){return <button key={n} onClick={function(){setFbRating(n);}} style={{fontFamily:"inherit",fontSize:18,background:"none",border:"none",cursor:"pointer",color:n<=fbRating?"#D0B16F":"#E7EAED",padding:"2px 4px"}}>{n<=fbRating?"★":"☆"}</button>;})}
              </div>
              <textarea ref={growRef} onInput={growOn} style={ta(3)} placeholder="Any comments? (optional)" value={fbText} onChange={function(e){setFbText(e.target.value);}}/>
              <input key="fb-email" autoComplete="email" type="email" style={{...inp,marginTop:8}} placeholder="Your email (optional - so we can follow up)" value={fbEmail} onChange={function(e){setFbEmail(e.target.value);}}/>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button style={Object.assign({},btnSm,{background:"#01236D",color:"#fff",border:"none"})} onClick={submitFeedback} disabled={fbLoad||(!fbText.trim()&&fbRating===0)}>{fbLoad?"Sending...":"Send Feedback"}</button>
                <button style={btnSm} onClick={function(){setShowFeedback(false);setFbText("");setFbRating(0);setFbEmail("");}}>Cancel</button>
              </div>
            </div>
          )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

</script>
</body>
</html>
