function shortMonth(m){
  if(!m)return"";
  if(/^Month /.test(m))return m.replace("Month ","M");
  return m.replace(/\s(\d{2})(\d{2})$/,function(_,a,b){return" "+b;});
}

const STORAGE_KEY="bpg_fd";

function fmtDate(v){if(!v)return"Not specified";var parts=v.split("-");var months=["January","February","March","April","May","June","July","August","September","October","November","December"];return parseInt(parts[2])+" "+months[parseInt(parts[1])-1]+" "+parts[0];}
function fmt(n){const v=Math.round(Number(n));return(v<0?"-$":"$")+Math.abs(v).toLocaleString();}
// Chart axis labels. Scales to the data instead of always dividing by 1000,
// which made every tick read "$0k" for businesses turning over under $1k a
// month. Keeps the sign, which Math.abs() alone would discard.
function axisFmt(v){
  const a=Math.abs(Number(v)||0);
  const sign=v<0?"-$":"$";
  if(a>=1000000)return sign+(a/1000000).toFixed(1).replace(/\.0$/,"")+"m";
  if(a>=10000)return sign+Math.round(a/1000)+"k";
  if(a>=1000)return sign+(a/1000).toFixed(1).replace(/\.0$/,"")+"k";
  return sign+Math.round(a).toLocaleString();
}

function parseMonthly(str,def){
  if(def===undefined)def=0;
  if(!str||str.toLowerCase()==="no"||!str.trim())return Array(12).fill(def);
  const s=str.trim();
  if(s.includes("M")&&s.includes(":")){
    const arr=Array(12).fill(def);
    s.split(",").forEach(part=>{
      const m=part.trim().match(/M(\d+):([0-9.]+)/i);
      if(m){const idx=parseInt(m[1])-1;if(idx>=0&&idx<12)arr[idx]=parseFloat(m[2]);}
    });
    return arr;
  }
  const n=parseFloat(s.replace(/[^0-9.]/g,""));
  return Array(12).fill(isNaN(n)?def:n);
}

function parseGrowth(str){
  if(!str||str.toLowerCase()==="no"||!str.trim())return Array(12).fill(0);
  const s=str.trim();
  if(s.includes("M")&&s.includes(":")){
    const arr=Array(12).fill(0);
    s.split(",").forEach(part=>{
      const m=part.trim().match(/M(\d+):([0-9.]+)/i);
      if(m){const idx=parseInt(m[1])-1;if(idx>=0&&idx<12)arr[idx]=parseFloat(m[2]);}
    });
    return arr;
  }
  const n=parseFloat(s.replace(/[^0-9.]/g,""));
  return Array(12).fill(isNaN(n)?0:n);
}

function calcCashflow(f){
  const open=parseFloat(f.openingBalance)||0;
  const unitGrowth=parseGrowth(f.unitGrowth);
  const priceInc=parseGrowth(f.priceInc);
  const costInc=parseGrowth(f.costInc);
  const avgSales=parseMonthly(f.avgSales,0);
  const avgPrice=parseMonthly(f.avgPrice,0);
  const avgCost=parseMonthly(f.avgCost,0);
  const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var startYear=0,startMonth=0;
  if(f.cfStartDate){var parts=f.cfStartDate.split("-");startYear=parseInt(parts[0])||0;startMonth=parseInt(parts[1])||0;}
  function getMonthLabel(i){
    if(!startYear||!startMonth)return"Month "+(i+1);
    var m=(startMonth-1+i)%12;
    var y=startYear+Math.floor((startMonth-1+i)/12);
    return monthNames[m]+" "+y;
  }

  const expArr={};
  expCats.forEach(c=>{expArr[c.id]=parseMonthly(f[c.id],0);});
  const txArr={};
  txCats.forEach(c=>{txArr[c.id]=parseMonthly(f[c.id],0);});
  const taxRate=parseFloat(f.taxRate)||0;
  let accTax=0;

  let bal=open;
  const rows=[];

  for(let i=0;i<12;i++){
    // Revenue
    const monthlyUnits=parseMonthly(f.monthlyUnits,0);
    const hasMonthlyUnits=f.monthlyUnits&&f.monthlyUnits.includes("M");
    let units=hasMonthlyUnits?monthlyUnits[i]:parseFloat(f["month1Units"]||0);
    if(!hasMonthlyUnits&&i>0){
      for(let j=0;j<i;j++) units=units*(1+(unitGrowth[j]||0)/100);
    }
    let price=avgPrice[i]||parseFloat(f.avgPrice)||0;
    if(priceInc[i]) price=price*(1+priceInc[i]/100);
    const revProducts=Math.round(units*price);
    const revOther=Math.round(parseMonthly(f.otherRevenue,0)[i]);
    const revenue=revProducts+revOther;

    // COGS
    let cost=avgCost[i]||parseFloat(f.avgCost)||0;
    if(costInc[i]) cost=cost*(1+costInc[i]/100);
    const cogs=Math.round(units*cost);

    const grossProfit=revenue-cogs;

    // Expenses
    const expDetail={};
    let totalExpenses=0;
    expCats.forEach(c=>{
      const v=Math.round(expArr[c.id][i]);
      expDetail[c.id]=v;
      totalExpenses+=v;
    });

    const netProfit=grossProfit-totalExpenses;

    // Tax = (Net Profit + Team & contractors expense) * taxRate
    const teamExp=(expDetail["xTeam"]||0)+(expDetail["xCon"]||0);
    const taxableBase=netProfit+teamExp;
    const monthTax=Math.round(taxableBase*taxRate/100);
    const isTaxPayMonth=!!f["taxPayM"+(i+1)]||!Array.from({length:12},function(_,n){return f["taxPayM"+(n+1)];}).some(Boolean);
    const calcTax=isTaxPayMonth?accTax:0;
    if(isTaxPayMonth)accTax=0;
    accTax+=monthTax;

    // Other transactions
    const txDetail={};
    let otherTx=0;
    txCats.forEach(c=>{
      let v;
      if(c.id==="txTax"){
        // Always auto-calculated from the Tax rate - not user editable.
        // Convention: money in is positive, money out is negative.
        // Tax paid is an outflow, so the calculated figure is negated.
        v=-calcTax;
      } else {
        v=Math.round(txArr[c.id][i]);
      }
      txDetail[c.id]=v;
      otherTx+=v;
    });

    const netCashflow=netProfit+otherTx;
    const openBal=bal;
    bal=bal+netCashflow;

    rows.push({
      month:getMonthLabel(i),
      units:Math.round(units),
      avgPrice:Math.round(price*100)/100,
      avgCost:Math.round(cost*100)/100,
      revenue,revProducts,revOther,
      cogs,grossProfit,
      expDetail,totalExpenses,
      netProfit,
      txDetail,otherTx,
      netCashflow,
      openingBalance:openBal,
      closingBalance:bal
    });
  }
  return rows;
}

function WhatIf({liveRows,wiRev,wiExp,wiCos,setWiRev,setWiExp,setWiCos}){
  if(!liveRows||!liveRows.length)return null;
  var wiUnitsState=useState(0);var wiUnits=wiUnitsState[0];var setWiUnits=wiUnitsState[1];
  var wiPriceState=useState(0);var wiPrice=wiPriceState[0];var setWiPrice=wiPriceState[1];
  var wiCostState=useState(0);var wiCostU=wiCostState[0];var setWiCostU=wiCostState[1];
  var wiTeamState=useState(0);var wiTeam=wiTeamState[0];var setWiTeam=wiTeamState[1];
  var wiTotalExpState=useState(0);var wiTotalExp=wiTotalExpState[0];var setWiTotalExp=wiTotalExpState[1];

  const adj=liveRows.map(function(r){
    var units=Math.round((r.units||0)*(1+wiUnits/100));
    var price=r.units>0?(r.revProducts/r.units)*(1+wiPrice/100):0;
    var cost=r.units>0?(r.cogs/r.units)*(1+wiCostU/100):0;
    var rev=Math.round(units*price)+(r.revOther||0);
    var cogs=Math.round(units*cost);
    var gp=rev-cogs;
    var teamAdj=Math.round((r.expDetail&&(r.expDetail.xTeam||0)||0)*(1+wiTeam/100));
    var teamOrig=r.expDetail&&(r.expDetail.xTeam||0)||0;
    var exp=Math.round(r.totalExpenses*(1+wiTotalExp/100))+(teamAdj-teamOrig);

function MonthGrid({keyPrefix,keyPostfix,storeKey,fdRef,onUpdate,GREEN,inp,btnSm,startMonth}){
  var post=keyPostfix||"";
  var start=(startMonth||1)-1;
  var verState=useState(0);var ver=verState[0];var setVer=verState[1];
  var copiedState=useState(false);var copied=copiedState[0];var setCopied=copiedState[1];
  // Label months from the cashflow start date set in Step 5 (format "YYYY-MM").
  // Falls back to M1..M12 until that date has been chosen.
  var SHORT_MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var cfs=(fdRef.current&&fdRef.current.cfStartDate)||"";
  var cfp=String(cfs).split("-");
  var sy=parseInt(cfp[0]),sm=parseInt(cfp[1]);
  var hasStart=!!(sy&&sm&&sm>=1&&sm<=12);
  function monthLabel(m){
    if(!hasStart)return "M"+(m+1);
    var idx=(sm-1+m)%12;
    var yr=sy+Math.floor((sm-1+m)/12);
    return SHORT_MONTHS[idx]+" "+String(yr).slice(2);
  }
  function mKey(m){return keyPrefix+(m+1)+post;}
  var mgStyle={display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:6};
  return (
    <div>
      <div key={storeKey+"-"+ver} style={mgStyle}>
        {Array.from({length:12},function(_,m){
          var key=mKey(m);
          var locked=m<start;
          return (<div key={m}>
              <label style={{fontSize:10,color:locked?"#d1d5db":"#9ca3af",marginBottom:2,display:"block",textAlign:"center"}}>{monthLabel(m)}</label>
              <input style={Object.assign({},inp,{textAlign:"right",padding:"6px 8px",fontSize:13},locked?{background:"#f3f4f6",color:"#d1d5db",cursor:"not-allowed"}:{})} defaultValue={locked?"":fdRef.current[key]||""} placeholder={locked?"-":"0"} readOnly={locked} onChange={locked?undefined:function(e){
                fdRef.current[key]=e.target.value;
                var parts=Array.from({length:12},function(_,n){return n<start?"0":fdRef.current[mKey(n)]||"0";});
                fdRef.current[storeKey]=parts.map(function(v,n){return "M"+(n+1)+":"+v;}).join(",");
                if(onUpdate)onUpdate();
              }}/>
            </div>);
        })}
      </div>
      <button style={Object.assign({},btnSm,{marginTop:6,fontSize:11})} onClick={function(){
        if(copied){
          Array.from({length:12},function(_,m){if(m>=start)fdRef.current[mKey(m)]="";});
          fdRef.current[storeKey]="";
          setCopied(false);
        } else {
          var v=fdRef.current[mKey(start)]||"";
          if(!v||v==="0")return;
          Array.from({length:12},function(_,m){if(m>=start)fdRef.current[mKey(m)]=v;});
          fdRef.current[storeKey]=Array.from({length:12},function(_,m){return "M"+(m+1)+":"+(m<start?"0":fdRef.current[mKey(m)]||"0");}).join(",");
          setCopied(true);
        }
        setVer(function(n){return n+1;});
        if(onUpdate)onUpdate();
      }}>{copied?"Clear all months":"Copy "+monthLabel(start)+" to all months"}</button>
    </div>
  );
}

    var prompt="For this specific business goal, suggest:\n1. How to achieve it (2-3 concrete action steps, 1-2 sentences)\n2. Resources needed (people, tools, budget - 1-2 sentences)\n\nBusiness: "+(fdRef.current.bizName||"")+" - "+(fdRef.current.description||"")+"\nIndustry: "+(fdRef.current.industry||"")+"\nGoal: "+(goals[i]||"")+"\n\nReturn in this exact format:\nHow: [your suggestion]\nResources: [your suggestion]";
    try{
      var res=await fetch("https://b-plandiy.com/.netlify/functions/anthropic",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,messages:[{role:"user",content:prompt}]})});
      var data=await res.json();
      var text=data.content.map(function(x){return x.text||"";}).join("").trim();
      var howMatch=text.match(/How:\s*([\s\S]+?)(?:\nResources:|$)/);
      var resMatch=text.match(/Resources:\s*([\s\S]+?)$/);
      if(howMatch)fdRef.current["goalHow"+(i+1)]=howMatch[1].trim();
      if(resMatch)fdRef.current["goalRes"+(i+1)]=resMatch[1].trim();
      saveToStorage();
      setGoalCardVer(function(prev){var n=Object.assign({},prev);n[i]=(n[i]||0)+1;return n;});

  function downloadCashflowExcel(){
    var cfRows=liveRows;
    if(!cfRows||!cfRows.length){alert("No cashflow data to export.");return;}
    var bizName=fdRef.current.bizName||"Business";
    var mos=cfRows.map(function(r){return r.month.replace("Month ","M");});

    function buildExcel(){
      var XLSX=window.XLSX;
      if(!XLSX){alert("Excel library not loaded. Please try again.");return;}
      var wb=XLSX.utils.book_new();
      var data=[];
      var header=[""].concat(mos).concat(["Total"]);
      function dr(label,vals,opts){
        opts=opts||{};
        var tot=vals.reduce(function(a,b){return a+(b||0);},0);
        // Averages must not be summed - leave their Total cell blank
        return [label].concat(vals.map(function(v){return v||0;})).concat([opts.noTotal?"":tot]);
      }
      function sr(label){return [label].concat(Array(mos.length+1).fill(""));}

      data.push([bizName+" - 12 Month Cashflow Forecast"]);
      data.push([]);
      data.push(header);
      data.push(sr("KEY DRIVERS"));
      data.push(dr("Units Sold",cfRows.map(function(r){return r.units||0;})));
      data.push(dr("Avg Price",cfRows.map(function(r){return r.avgPrice||0;}),{noTotal:true}));
      data.push(dr("Avg Cost",cfRows.map(function(r){return r.avgCost||0;}),{noTotal:true}));
      data.push(sr("REVENUE"));
      data.push(dr("Products/Services",cfRows.map(function(r){return r.revProducts||0;})));
      data.push(dr("Other Revenue",cfRows.map(function(r){return r.revOther||0;})));
      data.push(dr("Total Revenue",cfRows.map(function(r){return r.revenue||0;})));
      data.push(sr("COST OF SALES"));
      data.push(dr("Cost of Sales",cfRows.map(function(r){return r.cogs||0;})));
      data.push(dr("Gross Profit",cfRows.map(function(r){return r.grossProfit||0;})));
      data.push(sr("EXPENSES"));
      expCats.forEach(function(c){
        var ev=cfRows.map(function(r){return r.expDetail&&r.expDetail[c.id]||0;});
        if(ev.some(function(v){return v!==0;}))data.push(dr(c.l,ev));
      });
      data.push(dr("Total Expenses",cfRows.map(function(r){return r.totalExpenses||0;})));
      data.push(dr("Net Profit/(Loss)",cfRows.map(function(r){return r.netProfit||0;})));
      data.push(sr("OTHER TRANSACTIONS"));
      txCats.forEach(function(c){
        var tv=cfRows.map(function(r){return r.txDetail&&r.txDetail[c.id]||0;});
        if(tv.some(function(v){return v!==0;}))data.push(dr(c.l,tv));
      });
      data.push(dr("Total Other Transactions",cfRows.map(function(r){return r.otherTx||0;})));
      data.push(sr("CASHFLOW"));
      data.push(dr("Opening Balance",cfRows.map(function(r){return r.openingBalance||0;}),{noTotal:true}));
      data.push(dr("Net Cashflow",cfRows.map(function(r){return r.netCashflow||0;})));
      data.push(dr("Closing Balance",cfRows.map(function(r){return r.closingBalance||0;}),{noTotal:true}));

      var ws=XLSX.utils.aoa_to_sheet(data);
      var wsCols=[{wch:28}];
      for(var wi=0;wi<mos.length+1;wi++)wsCols.push({wch:12});
      ws["!cols"]=wsCols;
      ws["!freeze"]={xSplit:1,ySplit:3};
      XLSX.utils.book_append_sheet(wb,ws,"Cashflow Forecast");
      XLSX.writeFile(wb,bizName.replace(/[^a-z0-9]/gi,"-")+"-cashflow.xlsx");
    }

    if(window.XLSX){
      buildExcel();
    } else {
      var xlsxScript=document.createElement("script");
      xlsxScript.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
      xlsxScript.onload=function(){buildExcel();};
      xlsxScript.onerror=function(){alert("Could not load Excel library. Please try again.");};
      document.head.appendChild(xlsxScript);
    }
  }
  function generateWordDoc(){
    function fmtN(n){var v=Math.round(Number(n));return(v<0?"-$":"$")+Math.abs(v).toLocaleString();}
    var f=fdRef.current;
    var cfRows=liveRows;
    var today=new Date();
    var months2=["January","February","March","April","May","June","July","August","September","October","November","December"];
    var dateStr=today.getDate()+" "+months2[today.getMonth()]+" "+today.getFullYear();

    function buildAndSave(){
      var docx=window.docx||window.DocxJS||window.DOCX;
      if(!docx||!docx.Document){
        // Try to find it — UMD builds sometimes use different global names
        var keys=Object.keys(window).filter(function(k){return window[k]&&window[k].Document&&window[k].Packer;});
        if(keys.length){docx=window[keys[0]];}
      }
      if(!docx||!docx.Document){alert("docx library not loaded — please try again in a moment");return;}
      var Document=docx.Document,Packer=docx.Packer,Paragraph=docx.Paragraph,TextRun=docx.TextRun;
      var HeadingLevel=docx.HeadingLevel,Table=docx.Table,TableRow=docx.TableRow,TableCell=docx.TableCell;
      var WidthType=docx.WidthType,AlignmentType=docx.AlignmentType,ShadingType=docx.ShadingType;
      var TableLayoutType=docx.TableLayoutType||{FIXED:"fixed"};
      var ImageRun=docx.ImageRun;
      var FONT="Aptos";
      // Portrait: 12240 x 15840 twips (A4), Landscape: 15840 x 12240
      // A4 = 11906 x 16838 twips.
      // NOTE: docx flips width/height itself when orientation is LANDSCAPE
      // (w:w = height, w:h = width). So BOTH entries below pass A4 portrait
      // dimensions; the orientation flag alone decides the result.
      // Passing 16838x11906 with "landscape" yields a PORTRAIT page.
      var PORTRAIT={width:11906,height:16838,orientation:"portrait"};
      var LANDSCAPE={width:11906,height:16838,orientation:"landscape"};
      var MARGIN={top:720,right:720,bottom:720,left:720};

      // --- Section 1: Business Plan (Portrait) ---
      var planChildren=[];
      planChildren.push(new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:160},children:[new TextRun({text:f.bizName||"Business Plan",bold:true,size:48,color:"01236d",font:FONT})]}));
      planChildren.push(new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:80},children:[new TextRun({text:"Business Plan and Cashflow Forecast",size:32,color:"d0b16f",font:FONT})]}));
      planChildren.push(new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:320},children:[new TextRun({text:dateStr,size:20,color:"6b7280",font:FONT})]}));
      if(planHtml){
        var strippedHtml=planHtml.replace(/<div[^>]*text-align:center[\s\S]*?<\/div>\s*<\/div>/i,"").replace(/<div[^>]*text-align:center[^>]*>[\s\S]*?<\/div>/i,"").trim();
        // Tags are stripped above, but HTML entities must also be decoded or
        // they appear literally in Word (e.g. "&amp;" instead of "&").
        // &amp; is decoded last so "&amp;lt;" correctly yields "&lt;".
        function decodeEntities(s){
          return String(s)
            .replace(/&nbsp;/g," ")
            .replace(/&lt;/g,"<")
            .replace(/&gt;/g,">")
            .replace(/&quot;/g,'"')
            .replace(/&#0?39;/g,"'")
            .replace(/&apos;/g,"'")
            .replace(/&amp;/g,"&");
        }
        var clean=decodeEntities(strippedHtml.replace(/<h2[^>]*>(.*?)<\/h2>/gi,"\n##$1\n").replace(/<h3[^>]*>(.*?)<\/h3>/gi,"\n###$1\n").replace(/<p[^>]*>(.*?)<\/p>/gi,"$1\n").replace(/<li[^>]*>(.*?)<\/li>/gi,"- $1\n").replace(/<[^>]+>/g,"").replace(/\*\*/g,""));
        clean.split("\n").forEach(function(ln){
          var t=ln.trim();if(!t)return;
          if(t.startsWith("##")&&!t.startsWith("###"))planChildren.push(new Paragraph({heading:HeadingLevel.HEADING_1,spacing:{before:280,after:80},children:[new TextRun({text:t.replace(/^##\s*/,""),bold:true,color:"01236d",size:28,font:FONT})]}));
          else if(t.startsWith("###"))planChildren.push(new Paragraph({heading:HeadingLevel.HEADING_2,spacing:{before:160,after:60},children:[new TextRun({text:t.replace(/^###\s*/,""),bold:true,color:"374151",size:24,font:FONT})]}));
          else if(t.startsWith("- "))planChildren.push(new Paragraph({bullet:{level:0},spacing:{after:40},children:[new TextRun({text:t.slice(2),size:20,font:FONT})]}));
          else planChildren.push(new Paragraph({spacing:{after:80},children:[new TextRun({text:t,size:20,font:FONT})]}));
        });
      }

      // --- Section 2: Graphs (Portrait) ---
      var graphChildren=[];
      graphChildren.push(new Paragraph({pageBreakBefore:true,spacing:{after:200},children:[new TextRun({text:"Financial Graphs",bold:true,size:36,color:"01236d",font:FONT})]}));

      var CHART_COLORS=["#01236d","#d0b16f","#4e73df","#1cc88a","#36b9cc","#f6c23e","#e74a3b","#858796","#5a5c69","#2e59d9","#17a673","#2c9faf","#fd7e14","#6610f2"];

      // Shared axis helper. Always includes zero in the range so negative
      // values sit below the baseline rather than mirroring positives.
      function chartScale(vals,plotTop,plotH){
        var lo=Math.min.apply(null,vals.concat([0]));
        var hi=Math.max.apply(null,vals.concat([0]));
        if(hi===lo)hi=lo+1;
        // Round outward to a tidy step so axis labels read cleanly
        var raw=(hi-lo)/4;
        var mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
        var step=Math.ceil(raw/mag)*mag;
        if(step<1)step=1;
        lo=Math.floor(lo/step)*step;
        hi=Math.ceil(hi/step)*step;
        return {
          lo:lo, hi:hi, step:step,
          y:function(v){return plotTop+plotH-(v-lo)/(hi-lo)*plotH;}
        };
      }

      // Mirrors axisFmt() used by the on-screen charts so the same values
      // read identically in the app and the Word document.
      function axisLabel(v){
        var a=Math.abs(v);
        var sign=v<0?"-$":"$";
        if(a>=1000000)return sign+(a/1000000).toFixed(1).replace(/\.0$/,"")+"m";
        if(a>=10000)return sign+Math.round(a/1000)+"k";
        if(a>=1000)return sign+(a/1000).toFixed(1).replace(/\.0$/,"")+"k";
        return sign+Math.round(a).toLocaleString();
      }

      function drawAxes(ctx,sc,padL,plotTop,plotH,plotW,isCurrency){
        ctx.textAlign="right";
        ctx.font="10px Arial";
        for(var v=sc.lo; v<=sc.hi+sc.step/2; v+=sc.step){
          var y=sc.y(v);
          ctx.strokeStyle=(Math.abs(v)<sc.step/1000)?"#9ca3af":"#eceff4";
          ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();
          ctx.fillStyle="#6b7280";
          ctx.fillText(isCurrency?axisLabel(v):String(Math.round(v)),padL-6,y+3);
        }
      }

      function makeBarChart(title,data,color,negColor,isCurrency){
        var canvas=document.createElement("canvas");
        var W=680,padL=64,padR=28,padT=34,padB=34;
        var plotH=210,plotW=W-padL-padR;
        canvas.width=W;canvas.height=padT+plotH+padB;
        var ctx=canvas.getContext("2d");
        ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,canvas.height);
        ctx.fillStyle="#01236d";ctx.font="bold 14px Arial";ctx.textAlign="center";
        ctx.fillText(title,W/2,20);

        var vals=data.map(function(d){return d.v;});
        var sc=chartScale(vals,padT,plotH);
        drawAxes(ctx,sc,padL,padT,plotH,plotW,isCurrency!==false);

        var zeroY=sc.y(0);
        var slot=plotW/data.length;
        var barW=Math.max(4,Math.min(34,slot*0.62));
        data.forEach(function(d,i){
          var vy=sc.y(d.v);
          var top=Math.min(zeroY,vy);
          var h=Math.max(1,Math.abs(vy-zeroY));
          var x=padL+i*slot+(slot-barW)/2;
          ctx.fillStyle=d.v<0?(negColor||"#A32D2D"):(color||"#01236d");
          ctx.fillRect(x,top,barW,h);
        });

        ctx.strokeStyle="#9ca3af";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(padL,zeroY);ctx.lineTo(padL+plotW,zeroY);ctx.stroke();

        ctx.fillStyle="#6b7280";ctx.font="10px Arial";ctx.textAlign="center";
        data.forEach(function(d,i){
          ctx.fillText(d.l,padL+i*slot+slot/2,padT+plotH+14);
        });
        return canvas.toDataURL("image/png").split(",")[1];
      }

      function makeLineChart(title,data,color,negColor,isCurrency){
        var canvas=document.createElement("canvas");
        var W=680,padL=64,padR=28,padT=34,padB=34;
        var plotH=210,plotW=W-padL-padR;
        canvas.width=W;canvas.height=padT+plotH+padB;
        var ctx=canvas.getContext("2d");
        ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,canvas.height);
        ctx.fillStyle="#01236d";ctx.font="bold 14px Arial";ctx.textAlign="center";
        ctx.fillText(title,W/2,20);

        var vals=data.map(function(d){return d.v;});
        var sc=chartScale(vals,padT,plotH);
        drawAxes(ctx,sc,padL,padT,plotH,plotW,isCurrency!==false);

        var zeroY=sc.y(0);
        ctx.strokeStyle="#9ca3af";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(padL,zeroY);ctx.lineTo(padL+plotW,zeroY);ctx.stroke();

        var slot=plotW/data.length;
        var pts=data.map(function(d,i){
          return {x:padL+i*slot+slot/2, y:sc.y(d.v), v:d.v};
        });
        ctx.strokeStyle=color||"#01236d";ctx.lineWidth=2;
        ctx.beginPath();
        pts.forEach(function(p,i){if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
        ctx.stroke();
        pts.forEach(function(p){
          ctx.fillStyle=p.v<0?(negColor||"#A32D2D"):(color||"#01236d");
          ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle="#ffffff";ctx.lineWidth=1;ctx.stroke();
        });

        ctx.fillStyle="#6b7280";ctx.font="10px Arial";ctx.textAlign="center";
        data.forEach(function(d,i){
          ctx.fillText(d.l,padL+i*slot+slot/2,padT+plotH+14);
        });
        return canvas.toDataURL("image/png").split(",")[1];
      }

      function makePieChart(title,pieData){
        var total=pieData.reduce(function(s,d){return s+d.v;},0);
        if(!total)return null;
        // Height grows with the legend so many categories never overflow
        var rowH=19, legendTop=44;
        var W=680;
        var H=Math.max(260, legendTop+pieData.length*rowH+24);
        var canvas=document.createElement("canvas");
        canvas.width=W;canvas.height=H;
        var ctx=canvas.getContext("2d");
        ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,H);
        ctx.fillStyle="#01236d";ctx.font="bold 14px Arial";ctx.textAlign="center";
        ctx.fillText(title,W/2,20);

        var r=Math.min(96,(H-legendTop-30)/2);
        var cx=30+r, cy=legendTop+r+4;
        var angle=-Math.PI/2;
        pieData.forEach(function(d,i){
          var slice=d.v/total*Math.PI*2;
          ctx.fillStyle=CHART_COLORS[i%CHART_COLORS.length];
          ctx.beginPath();ctx.moveTo(cx,cy);
          ctx.arc(cx,cy,r,angle,angle+slice);
          ctx.closePath();ctx.fill();
          ctx.strokeStyle="#ffffff";ctx.lineWidth=1;ctx.stroke();
          angle+=slice;
        });

        var lx=cx+r+34;
        pieData.forEach(function(d,i){
          var y=legendTop+i*rowH;
          ctx.fillStyle=CHART_COLORS[i%CHART_COLORS.length];
          ctx.fillRect(lx,y,11,11);
          ctx.fillStyle="#374151";ctx.font="11px Arial";ctx.textAlign="left";
          var pct=Math.round(d.v/total*100);
          var label=d.l;
          if(label.length>26)label=label.slice(0,25)+"\u2026";
          ctx.fillText(label,lx+16,y+9);
          ctx.textAlign="right";
          ctx.fillStyle="#6b7280";
          ctx.fillText(axisLabel(d.v)+"  "+pct+"%",W-16,y+9);
        });
        return canvas.toDataURL("image/png").split(",")[1];
      }

      if(cfRows&&cfRows.length){
        var npData=cfRows.map(function(r){return{l:shortMonth(r.month),v:r.netProfit||0};});
        var cbData=cfRows.map(function(r){return{l:shortMonth(r.month),v:r.closingBalance||0};});
        var unData=cfRows.map(function(r){return{l:shortMonth(r.month),v:r.units||0};});
        var expPieRaw=expCats.map(function(c){
          var tot=cfRows.reduce(function(s,r){return s+(r.expDetail&&r.expDetail[c.id]||0);},0);
          return tot>0?{l:c.l,v:tot}:null;
        }).filter(Boolean);
        try{
          // Canvas is 680x278 for bar/line charts. Render at 468pt wide
          // (fits A4 portrait inside 0.5in margins) preserving aspect ratio.
          var CW=680, CH=278, IMG_W=468, IMG_H=Math.round(IMG_W*CH/CW);
          function pushChart(heading,b64,w,h){
            graphChildren.push(new Paragraph({spacing:{after:100},children:[new TextRun({text:heading,bold:true,size:22,color:"01236d",font:FONT})]}));
            graphChildren.push(new Paragraph({spacing:{after:240},children:[new ImageRun({data:Uint8Array.from(atob(b64),function(ch){return ch.charCodeAt(0);}),transformation:{width:w,height:h},type:"png"})]}));
          }

          pushChart("Units Sold",makeBarChart("Units Sold",unData,"#d0b16f","#d0b16f",false),IMG_W,IMG_H);

          if(expPieRaw.length){
            var pieRowH=19, pieTop=44;

            var expImg=makePieChart("Expenses Breakdown",expPieRaw);
            if(expImg)pushChart("Expenses Breakdown",expImg,IMG_W,Math.round(IMG_W*pieCH/CW));
          }

          pushChart("Net Profit / (Loss)",makeLineChart("Net Profit / (Loss)",npData,"#01236d","#A32D2D",true),IMG_W,IMG_H);

      // --- Section 3: Cashflow (Landscape) ---
      var cfChildren=[];
      cfChildren.push(new Paragraph({spacing:{after:200},children:[new TextRun({text:"12-Month Cashflow Forecast",bold:true,size:32,color:"01236d",font:FONT})]}));
      if(cfRows&&cfRows.length){
        var mos=cfRows.map(function(r){return r.month.replace("Month ","M");});
        // A4 landscape 16838tw - 1440tw margins = 15398tw usable.
        // Label 2200 + 13 x 1015 = 15395tw, so the table fills the page exactly.
        var LBL_W=2200, cw=1015;
        var colWidths=[LBL_W].concat(Array(mos.length+1).fill(cw));
        var TBL_W=LBL_W+cw*(mos.length+1);
        var navy={type:ShadingType.SOLID,color:"01236d",fill:"01236d"};
        var hBg={type:ShadingType.SOLID,color:"eef1f8",fill:"eef1f8"};
        var bBg={type:ShadingType.SOLID,color:"f9fafb",fill:"f9fafb"};
        function mc(txt,o){o=o||{};return new TableCell({width:{size:o.first?LBL_W:cw,type:WidthType.DXA},margins:{top:20,bottom:20,left:50,right:50},shading:o.sh,children:[new Paragraph({alignment:o.first?AlignmentType.LEFT:AlignmentType.RIGHT,children:[new TextRun({text:String(txt||""),bold:!!o.b,color:o.c||"1a1a1a",size:16,font:FONT})]})]}); }
        function mhr(lbl){var cs=[mc(lbl,{first:true,b:true,c:"01236d",sh:hBg})];mos.forEach(function(){cs.push(mc("",{sh:hBg}));});cs.push(mc("",{sh:hBg}));return new TableRow({children:cs});}
        // opts.plain = render as a plain number (units), not currency
        // opts.noTotal = leave the Total cell blank (averages don't sum meaningfully)
        function mr(lbl,vals,bold,opts){
          opts=opts||{};
          var f=opts.plain?function(v){return Math.round(v).toLocaleString();}:fmtN;
          var tot=vals.reduce(function(s,v){return s+v;},0);
          var s=bold?bBg:undefined;
          var cs=[mc(lbl,{first:true,b:bold,sh:s})];
          vals.forEach(function(v){cs.push(mc(v?f(v):"",{b:bold,c:v<0?"A32D2D":"1a1a1a",sh:s}));});
          var totTxt=opts.noTotal?"":(tot?f(tot):"");
          cs.push(mc(totTxt,{b:true,c:tot<0?"A32D2D":"1a1a1a",sh:s}));
          return new TableRow({children:cs});
        }
        function mrk(lbl,key,bold,opts){return mr(lbl,cfRows.map(function(r){return r[key]||0;}),bold,opts);}
        var hc=[mc("Item",{first:true,b:true,c:"FFFFFF",sh:navy})];
        mos.forEach(function(m){hc.push(mc(m,{b:true,c:"FFFFFF",sh:navy}));});
        hc.push(mc("Total",{b:true,c:"FFFFFF",sh:navy}));
        var tblRows=[new TableRow({children:hc})];
        tblRows.push(mhr("Key Drivers"));
        tblRows.push(mr("Units Sold",cfRows.map(function(r){return r.units||0;}),false,{plain:true}));

          {properties:{page:{size:PORTRAIT,margin:MARGIN}},children:planChildren.concat(graphChildren)},
          {properties:{page:{size:LANDSCAPE,margin:MARGIN}},children:cfChildren}

  async function generatePlan(){
    setLoading(true);

    setLoadMsg("Generating your business plan, this may take a minute...");
    var f=fdRef.current;
    // Per-goal execution detail. These fields are captured in Step 4 (and by the
    // AI Suggest button) and are the substance of the "Making it Happen" section.
    var goalsPlanText=goals.map(function(g,i){
      if(!g)return "";
      var h=f["goalHow"+(i+1)]||"";
      var r=f["goalRes"+(i+1)]||"";
      var out=(i+1)+". GOAL: "+g;
      out+="\n   HOW: "+(h||"not specified by the user");
      out+="\n   RESOURCES NEEDED: "+(r||"not specified by the user");
      return out;
    }).filter(Boolean).join("\n")||"Not specified";
    // Send 12-month totals, not the raw stored strings. Passing "M1:0,M2:0,M3:0,
    // M4:200,..." makes the model expand it into one bullet per month, which is
    // noise in a business plan and eats the word budget.
    var cfr=liveRows||[];
    function catTotal(detailKey,id){return cfr.reduce(function(s,r){return s+((r[detailKey]&&r[detailKey][id])||0);},0);}
    function moneyStr(n){var v=Math.round(n);return (v<0?"-$":"$")+Math.abs(v).toLocaleString();}
    var expText=expCats.map(function(c){
      var tot=catTotal("expDetail",c.id);
      return tot?c.l+": "+moneyStr(tot):null;
    }).filter(Boolean).join("; ")||"Not specified";
    var totalExp12=expCats.reduce(function(s,c){return s+catTotal("expDetail",c.id);},0);
    if(totalExp12)expText+=" (total "+moneyStr(totalExp12)+" over 12 months)";
    var txText=txCats.map(function(c){
      var tot=catTotal("txDetail",c.id);
      return tot?c.l+": "+moneyStr(tot)+" net":null;
    }).filter(Boolean).join("; ")||"None";
    var finBits=["Plan date (month the 12-month cashflow forecast begins): "+planDate,
                 "Opening bank balance: $"+(f.openingBalance||"0")];
    if(f.assets)finBits.push("Assets: "+f.assets);
    if(f.debt)finBits.push("Debt: "+f.debt);
    if(f.equity)finBits.push("Equity: "+f.equity);
    finBits.push("Expenses: "+expText);
    finBits.push("Other transactions: "+txText);
    var finText=finBits.join(" | ");
    var onlineText=onlineCh.map(function(c){return f[c.id]?c.label+": "+f[c.id]:null;}).filter(Boolean).join(", ")||"Not provided";
    var contactText=[f.cName?"Name: "+f.cName:null,f.cEmail?"Email: "+f.cEmail:null,f.cMobile?"Mobile: "+f.cMobile:null].filter(Boolean).join(", ")||"Not provided";
    var legalText=(legalOpts.find(function(o){return o.v===legalStatus;})||{}).l||"Not specified";

    var MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
    function fmtMonthYear(v){
      if(!v)return "Not specified";
      var p=String(v).split("-");
      var y=parseInt(p[0]),m=parseInt(p[1]);
      if(!y||!m||m<1||m>12)return "Not specified";
      return MONTH_NAMES[m-1]+" "+y;
    }
    var establishmentDate=fmtMonthYear(f.bizDate);
    var planDate=fmtMonthYear(f.cfStartDate);

    var prompt="You are an expert business consultant. Write a professional business plan following exactly these sections in this order.\n\n"+
      "STEP 1 - BUSINESS DETAILS: Business: "+(f.bizName||"")+" | Industry: "+(f.industry||"")+" | Type: "+(f.bizType||"")+" | Stage: "+(f.stage||"")+
      " | Establishment date: "+establishmentDate+
      " | Description: "+(f.description||"")+" | History: "+(f.history||"")+
      " | Locations: "+(f.locations||"")+" | Team: "+(f.team||"")+
      " | Online: "+onlineText+" | Contact: "+contactText+" | Legal: "+legalText+
      " | Notes: "+(f.extra1||"")+
      "\n\nSTEP 2 - MARKET & CUSTOMERS: Target customer: "+(f.targetCust||"")+" | Current customers: "+(f.currentCust||"")+
      " | Market opportunity: "+(f.marketSize||"")+" | Competitors: "+(f.competitors||"")+
      " | Competitor strengths/weaknesses: "+(f.compStrWeakness||"")+" | Competitive advantage: "+(f.advantage||"")+" | IP: "+(f.ip||"")+
      " | Notes: "+(f.extra3||"")+
      "\n\nSTEP 3 - VISION & STRATEGY: Vision: "+(f.vision||"")+" | Position: "+(f.position||"")+" | Values: "+(f.values||"")+
      " | SWOT Strengths: "+(f.swotS||"")+" | Weaknesses: "+(f.swotW||"")+" | Opportunities: "+(f.swotO||"")+" | Threats: "+(f.swotT||"")+
      " | Notes: "+(f.extra2||"")+
      "\n\nSTEP 4 - MAKING IT HAPPEN: Team: "+(f.execTeam||"")+" | New hires: "+(f.execTeamNew||"")+
      " | Marketing: "+(f.execMkt||"")+" | Additional marketing: "+(f.execMktLaunch||"")+
      " | Other (assets/funding): "+(f.execOther||"")+" | Notes: "+(f.extra4||"")+
      " | Estimated extra sales units from goals: "+(f.goalSalesTotal||"0")+" | Estimated extra expenses from goals: $"+(f.goalExpTotal||"0")+
      "\nPER-GOAL EXECUTION DETAIL (how each goal will be achieved and what it needs):\n"+goalsPlanText+
      "\n\nSTEP 5 - FINANCIAL POSITION: "+finText+
      "\n\nDATE TERMINOLOGY - follow exactly:\n"+
      "- Refer to the Step 1 date only as the \"establishment date\" (the month the business was established).\n"+
      "- Refer to the Step 5 date only as the \"plan date\" (the month the 12-month forecast begins).\n"+
      "- Never use the phrase \"launch date\", and never describe either date as a launch.\n"+
      "- If a date is \"Not specified\", simply omit it rather than guessing or inventing one.\n"+
      "\nWrite the plan with these ## sections in this exact order:\n"+
      "## 1. Business Details\n## 2. Market & Customers\n## 3. Vision & Position\n## 4. Goals & Achieving Them\n## 5. Financial Position\n\n"+
      "SECTION 2 REQUIREMENTS - Market & Customers:\n"+
      "- Describe the realistic, addressable market this business can actually reach given its size, stage, locations and resources. Do not quote large total-industry figures as if they were reachable.\n"+
      "- If the market opportunity supplied above is broad or nationwide, narrow it to the segment this business can realistically serve, and say why.\n"+
      "- For competitors, cover their strengths AND their weaknesses. Give the strengths genuine weight - do not dismiss competitors or list only their shortcomings.\n"+
      "- Then explain where this business can realistically compete against those strengths.\n\n"+
      "SECTION 3 REQUIREMENTS - Vision & Position:\n"+
      "- Present Vision, Position Statement and Values as three separate labelled blocks so each stands out clearly, using these exact ### subheadings in this order:\n"+
      "### Vision\n### Position Statement\n### Values\n"+
      "- Under each, state that element clearly and directly in its own short paragraph. Use the wording supplied above as the basis - refine it for clarity but do not replace its meaning or invent new content.\n"+
      "- For Values, present them as a short list of lines starting with - so each value is visible on its own line.\n"+
      "- Do NOT include goals in this section. Goals belong in section 4.\n\n"+
      "SECTION 4 REQUIREMENTS - Goals & Achieving Them:\n"+
      "- List each goal from the PER-GOAL EXECUTION DETAIL above as its own ### subheading, numbered, in this form:\n"+
      "### Goal 1: [short version of the goal]\n"+

      "- Where a goal's How or Resources says \"not specified by the user\", say briefly that it still needs to be decided rather than inventing detail.\n"+
      "- Do NOT use bullet points or dashes within the goal summaries - prose only.\n"+
      "- After all the goals, finish the section with one short paragraph headed ### Team & Resources covering the team as it stands, any planned hires, marketing support, and the estimated extra sales units and extra expenses from the goals.\n\n"+
      "SECTION 5 REQUIREMENTS - Financial Position:\n"+
      "- Summarise the financial position. Do NOT list figures month by month, and never write a line per month such as \"Month 1: $0, Month 2: $0\".\n"+

      "- Only discuss figures that were actually supplied above. If something was not provided, leave it out entirely - do not write \"nil\", \"n/a\" or \"$0\" for it, and do not invent a value.\n"+
      "- Keep this section to roughly 120 words.\n\n"+
      "FORMATTING:\n"+

      "- Section 4: ### subheadings per goal plus a ### Team & Resources block. Body text under each must be prose - no bullet points or dashes.\n"+

    try{

      text.trim().split("\n").forEach(function(ln){
        ln=ln.replace(/\*\*/g,"").replace(/^---+\s*$/,"");

          if(inOList){html+="</ol>";inOList=false;}
          html+="<p style='margin-bottom:8px;line-height:1.7;font-size:14px'>"+trimmed+"</p>";

      }
      setPlanHtml(html);
    }catch(e){
      setPlanHtml("<p style='color:#6b7280'>Error generating plan: "+e.message+". Please try again.</p>");
    }

  function importData(){
    var picker=document.createElement("input");
    picker.type="file";
    // No accept filter - show all files, so backups that lost their .json
    // extension (renamed, or saved as .txt) can still be selected.
    picker.onchange=function(){
      var file=picker.files&&picker.files[0];
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(){
        try{
          var data=JSON.parse(reader.result);
          if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("bad shape");
          if(!window.confirm("This will replace everything currently in the app with the contents of your backup file. Continue?"))return;
          fdRef.current=data;
          saveToStorage();
          setLegalStatus(data.legalStatus||"");
          setGoals(Array.from({length:6},function(_,i){return data["goal"+(i+1)]||"";}));
          setLiveRows(calcCashflow(data));
          setShowDirection(false);setShowOutput(false);
          setStepAndSave(0);
          window.scrollTo(0,0);
          alert("Backup restored successfully.");
        }catch(err){
          alert("That file could not be read. Please choose a backup file created by the Export button.");
        }
      };
      reader.onerror=function(){alert("Could not read that file. Please try again.");};
      reader.readAsText(file);
    };
    picker.click();
  }

        {currentStep.render()}
        <div style={{display:"flex",gap:10,marginTop:20}}>
          {step>0&&<button style={Object.assign({},btnSm,{background:"#01236d",color:"#fff",border:"none"})} onClick={function(){setStepAndSave(step-1);}}>Back</button>}
          {step<stepDefs.length-1
            ?<button style={Object.assign({},btnSm,{background:"#d0b16f",color:"#fff",border:"none",marginLeft:"auto"})} onClick={function(){setStepAndSave(step+1);}}>Next →</button>
            :<button style={Object.assign({},btnSm,{background:"#d0b16f",color:"#fff",border:"none",marginLeft:"auto"})} onClick={function(){setShowDirection(true);}}>Next →</button>
          }
        </div>
      </div>
      <AppFooter/>
      {adminMsg&&<div style={{background:GREEN_LIGHT,border:"1px solid "+GREEN,borderRadius:8,padding:"10px 14px",marginTop:8,fontSize:13,color:GREEN_DARK}}>{adminMsg}</div>}
      {showAdmin&&(<div style={{background:"#f9fafb",borderRadius:8,padding:16,marginTop:8,border:"1px solid #e5e7eb"}}>
        <div style={{fontSize:13,fontWeight:600,color:"#374151",marginBottom:8}}>Admin</div>
        <input style={inp} type="password" placeholder="Password" value={adminPw} onChange={function(e){setAdminPw(e.target.value);}}/>
        {adminPw==="stratdiy2025"&&(<div style={{marginTop:8}}>
          <textarea style={ta(2)} placeholder="Broadcast message to all users (leave blank to clear)" value={adminMsgInput} onChange={function(e){setAdminMsgInput(e.target.value);}}/>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button style={Object.assign({},btnSm,{background:"#01236d",color:"#fff",border:"none"})} onClick={function(){try{localStorage.setItem("bpg_admin_msg",adminMsgInput);}catch(e){}setShowAdmin(false);setAdminPw("");}}>Save & broadcast</button>
            <button style={btnSm} onClick={function(){setShowAdmin(false);setAdminPw("");}}>Cancel</button>
          </div>
        </div>)}
      </div>)}
      {showFeedback&&(
        <div style={{background:"#f9fafb",borderRadius:8,padding:16,marginTop:8,border:"1px solid #e5e7eb"}}>
          {fbDone?<div style={{textAlign:"center",color:"#d0b16f",fontSize:14,padding:"8px 0"}}>Thank you for your feedback!</div>:(
            <div>
              <div style={{fontSize:13,fontWeight:500,color:"#374151",marginBottom:8}}>How would you rate your experience?</div>
              <div style={{display:"flex",gap:6,marginBottom:12}}>
                {[1,2,3,4,5].map(function(n){return <button key={n} onClick={function(){setFbRating(n);}} style={{fontFamily:"inherit",fontSize:20,background:"none",border:"none",cursor:"pointer",color:n<=fbRating?"#f59e0b":"#d1d5db",padding:"2px 4px"}}>{n<=fbRating?"★":"☆"}</button>;})}
              </div>
              <textarea style={ta(3)} placeholder="Any comments? (optional)" value={fbText} onChange={function(e){setFbText(e.target.value);}}/>
              <input key="fb-email" autoComplete="email" type="email" style={{...inp,marginTop:8}} placeholder="Your email (optional - so we can follow up)" value={fbEmail} onChange={function(e){setFbEmail(e.target.value);}}/>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button style={Object.assign({},btnSm,{background:"#01236d",color:"#fff",border:"none"})} onClick={submitFeedback} disabled={fbLoad||(!fbText.trim()&&fbRating===0)}>{fbLoad?"Sending...":"Send Feedback"}</button>
                <button style={btnSm} onClick={function(){setShowFeedback(false);setFbText("");setFbRating(0);setFbEmail("");}}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

</script>
</body>
</html>
